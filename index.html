<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>METRO RUSH — 3D Endless Runner</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#03050b;
    font-family:Inter,Arial,sans-serif;
    color:white;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

#loading{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 35%,#17245b,#050713 65%);
    transition:.5s;
}

.loader{
    width:min(420px,85vw);
    text-align:center;
}

.loader-title{
    font-size:clamp(48px,10vw,90px);
    font-weight:1000;
    font-style:italic;
    letter-spacing:-5px;
    background:linear-gradient(120deg,#fff,#62eaff,#5270ff,#ff3cab);
    -webkit-background-clip:text;
    color:transparent;
}

.loader-sub{
    margin-top:12px;
    font-size:10px;
    letter-spacing:5px;
    color:#8b96b8;
}

.loader-bar{
    margin:35px auto 0;
    width:100%;
    height:5px;
    background:#ffffff12;
    border-radius:20px;
    overflow:hidden;
}

.loader-fill{
    height:100%;
    width:0;
    background:linear-gradient(90deg,#00eaff,#536bff,#ff3cab);
    box-shadow:0 0 20px #00eaff;
    transition:width .25s;
}

#menu{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    transition:.5s;
}

.menu-content{
    width:min(620px,92vw);
    text-align:center;
    pointer-events:auto;
}

.brand-mini{
    color:#8791b4;
    font-size:11px;
    font-weight:800;
    letter-spacing:6px;
    margin-bottom:10px;
}

.logo{
    font-size:clamp(58px,11vw,115px);
    line-height:.82;
    font-weight:1000;
    font-style:italic;
    letter-spacing:-7px;
    background:linear-gradient(130deg,#fff 5%,#6eefff 35%,#546dff 65%,#ff45bb);
    -webkit-background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 35px #395cff33);
}

.tagline{
    margin-top:20px;
    color:#aab3d0;
    font-size:12px;
    letter-spacing:5px;
}

.play{
    margin:40px auto 18px;
    width:min(350px,82vw);
    height:72px;
    border:0;
    border-radius:22px;
    cursor:pointer;
    font-size:17px;
    font-weight:1000;
    letter-spacing:3px;
    color:#03050c;
    background:linear-gradient(110deg,#fff,#72efff,#6375ff,#ff58c3);
    box-shadow:0 18px 60px #00eaff22;
    transition:.2s;
}

.play:hover{
    transform:translateY(-4px) scale(1.02);
    box-shadow:0 25px 70px #00eaff33;
}

.play:active{
    transform:scale(.97);
}

.best{
    display:flex;
    justify-content:center;
    gap:10px;
}

.best-box{
    min-width:150px;
    padding:15px 22px;
    border:1px solid #ffffff16;
    background:#ffffff09;
    border-radius:18px;
    backdrop-filter:blur(18px);
}

.best-label{
    font-size:8px;
    letter-spacing:2px;
    color:#727b99;
}

.best-value{
    margin-top:5px;
    font-size:20px;
    font-weight:900;
}

.help{
    margin-top:24px;
    font-size:11px;
    line-height:2;
    color:#77809d;
}

#hud{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
    opacity:0;
    transition:.3s;
}

#hud.show{
    opacity:1;
}

.hud-top{
    position:absolute;
    left:18px;
    right:18px;
    top:18px;
    display:flex;
    justify-content:space-between;
}

.stats{
    display:flex;
    gap:8px;
}

.card{
    min-width:105px;
    padding:10px 14px;
    border:1px solid #ffffff15;
    background:#05071399;
    backdrop-filter:blur(18px);
    border-radius:15px;
}

.card small{
    display:block;
    color:#707a99;
    font-size:7px;
    letter-spacing:2px;
    font-weight:900;
}

.card strong{
    display:block;
    margin-top:4px;
    font-size:18px;
}

.coin{
    color:#ffd83d;
}

.pause{
    pointer-events:auto;
    width:47px;
    height:47px;
    border-radius:15px;
    border:1px solid #ffffff18;
    background:#050713aa;
    color:white;
    cursor:pointer;
    backdrop-filter:blur(18px);
}

#speed{
    position:absolute;
    top:84px;
    left:50%;
    transform:translateX(-50%);
    width:min(270px,45vw);
    height:4px;
    border-radius:20px;
    background:#ffffff12;
    overflow:hidden;
}

#speedFill{
    width:10%;
    height:100%;
    background:linear-gradient(90deg,#00eaff,#5e70ff,#ff3cab);
    box-shadow:0 0 15px #00eaff;
}

.overlay{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#02030a88;
    backdrop-filter:blur(12px);
    opacity:0;
    visibility:hidden;
    transition:.3s;
}

.overlay.show{
    opacity:1;
    visibility:visible;
}

.panel{
    width:min(470px,90vw);
    padding:38px 25px;
    border-radius:28px;
    text-align:center;
    background:linear-gradient(145deg,#182044ee,#050713f5);
    border:1px solid #ffffff18;
    box-shadow:0 40px 100px #0009;
}

.panel h1{
    font-size:52px;
    font-weight:1000;
    font-style:italic;
    margin:8px 0 25px;
}

.paused{
    color:#68eaff;
}

.over{
    background:linear-gradient(90deg,#ff5474,#ff3cab);
    -webkit-background-clip:text;
    color:transparent;
}

.results{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:22px;
}

.result{
    padding:14px;
    border-radius:16px;
    background:#ffffff08;
    border:1px solid #ffffff0c;
}

.result span{
    display:block;
    color:#6e7795;
    font-size:8px;
    letter-spacing:2px;
}

.result b{
    display:block;
    margin-top:5px;
    font-size:22px;
}

.actions{
    display:flex;
    gap:9px;
}

.action{
    flex:1;
    height:54px;
    border-radius:16px;
    border:1px solid #ffffff15;
    color:white;
    background:#ffffff0b;
    cursor:pointer;
    font-weight:900;
    letter-spacing:1px;
}

.action.primary{
    color:#03050b;
    border:0;
    background:linear-gradient(110deg,#00eaff,#5d6fff);
}

@media(max-width:600px){

    .hud-top{
        top:10px;
        left:10px;
        right:10px;
    }

    .card{
        min-width:72px;
        padding:8px;
    }

    .card strong{
        font-size:14px;
    }

    .stats{
        gap:5px;
    }

    .pause{
        width:42px;
        height:42px;
    }

    .logo{
        letter-spacing:-4px;
    }

    .tagline{
        font-size:8px;
        letter-spacing:3px;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
    <div class="loader">
        <div class="loader-title">METRO RUSH</div>
        <div class="loader-sub">LOADING 3D METRO</div>
        <div class="loader-bar">
            <div id="loadFill" class="loader-fill"></div>
        </div>
    </div>
</div>

<div id="menu">
    <div class="menu-content">

        <div class="brand-mini">ORIGINAL 3D ENDLESS RUNNER</div>

        <div class="logo">
            METRO<br>RUSH
        </div>

        <div class="tagline">
            RUN • RIDE • ESCAPE
        </div>

        <button id="play" class="play">
            ▶ &nbsp; PLAY NOW
        </button>

        <div class="best">
            <div class="best-box">
                <div class="best-label">BEST SCORE</div>
                <div id="bestScore" class="best-value">0</div>
            </div>

            <div class="best-box">
                <div class="best-label">BEST COINS</div>
                <div id="bestCoins" class="best-value">0</div>
            </div>
        </div>

        <div class="help">
            DESKTOP: ← → MOVE &nbsp; • &nbsp; SPACE / ↑ JUMP<br>
            MOBILE: SWIPE LEFT / RIGHT / UP
        </div>

    </div>
</div>

<div id="hud">

    <div class="hud-top">

        <div class="stats">

            <div class="card">
                <small>SCORE</small>
                <strong id="score">0</strong>
            </div>

            <div class="card">
                <small>COINS</small>
                <strong id="coins" class="coin">0</strong>
            </div>

            <div class="card">
                <small>DISTANCE</small>
                <strong id="distance">0m</strong>
            </div>

        </div>

        <button id="pause" class="pause">Ⅱ</button>

    </div>

    <div id="speed">
        <div id="speedFill"></div>
    </div>

</div>

<div id="pauseOverlay" class="overlay">
    <div class="panel">
        <div style="font-size:9px;letter-spacing:4px;color:#687390">
            RUN PAUSED
        </div>

        <h1 class="paused">PAUSED</h1>

        <div class="actions">
            <button id="resume" class="action primary">
                RESUME
            </button>

            <button id="pauseRestart" class="action">
                RESTART
            </button>
        </div>
    </div>
</div>

<div id="gameOver" class="overlay">
    <div class="panel">

        <div style="font-size:9px;letter-spacing:4px;color:#687390">
            THE RUN HAS ENDED
        </div>

        <h1 class="over">GAME OVER</h1>

        <div class="results">

            <div class="result">
                <span>SCORE</span>
                <b id="finalScore">0</b>
            </div>

            <div class="result">
                <span>COINS</span>
                <b id="finalCoins">0</b>
            </div>

            <div class="result">
                <span>DISTANCE</span>
                <b id="finalDistance">0m</b>
            </div>

            <div class="result">
                <span>BEST</span>
                <b id="finalBest">0</b>
            </div>

        </div>

        <div class="actions">

            <button id="restart" class="action primary">
                ↻ RUN AGAIN
            </button>

            <button id="home" class="action">
                HOME
            </button>

        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>
/* ============================================================
   METRO RUSH 3D
   Single-file Three.js endless runner
   ============================================================ */

let scene;
let camera;
let renderer;
let clock;

let player;
let playerParts = {};

let trains = [];
let obstacles = [];
let coins = [];
let scenery = [];
let particles = [];

let gameState = "HOME";

let lane = 0;
let targetLane = 0;

let playerY = 0;
let verticalVelocity = 0;
let jumping = false;

let speed = 0.42;
let score = 0;
let coinCount = 0;
let distance = 0;
let difficulty = 0;

let spawnTimer = 0;
let coinTimer = 0;

let bestScore =
    Number(localStorage.getItem("metroRush3DBest") || 0);

let bestCoins =
    Number(localStorage.getItem("metroRush3DCoins") || 0);

document.getElementById("bestScore").textContent =
    bestScore.toLocaleString();

document.getElementById("bestCoins").textContent =
    bestCoins.toLocaleString();

/* ============================================================
   LOADING
   ============================================================ */

let load = 0;

const loadingTimer = setInterval(() => {

    load += Math.random() * 13;

    if(load >= 100){

        load = 100;

        clearInterval(loadingTimer);

        setTimeout(() => {

            document.getElementById("loading").style.opacity = "0";

            setTimeout(() => {
                document.getElementById("loading").style.display = "none";
            },500);

        },250);
    }

    document.getElementById("loadFill").style.width = load + "%";

},100);

/* ============================================================
   THREE INITIALIZATION
   ============================================================ */

function init(){

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x050817);

    scene.fog = new THREE.FogExp2(
        0x071025,
        0.018
    );

    camera = new THREE.PerspectiveCamera(
        62,
        window.innerWidth / window.innerHeight,
        0.1,
        300
    );

    camera.position.set(
        0,
        5.2,
        9.8
    );

    renderer = new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio,2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

    document.getElementById("game").appendChild(
        renderer.domElement
    );

    clock = new THREE.Clock();

    setupLights();
    setupWorld();
    createPlayer();

    window.addEventListener(
        "resize",
        resize
    );

    animate();
}

/* ============================================================
   LIGHTING
   ============================================================ */

function setupLights(){

    const hemi =
        new THREE.HemisphereLight(
            0x7aa8ff,
            0x090b15,
            1.8
        );

    scene.add(hemi);

    const moon =
        new THREE.DirectionalLight(
            0x9cc8ff,
            2.3
        );

    moon.position.set(
        -20,
        35,
        15
    );

    moon.castShadow = true;

    moon.shadow.mapSize.width = 1024;
    moon.shadow.mapSize.height = 1024;

    moon.shadow.camera.left = -35;
    moon.shadow.camera.right = 35;
    moon.shadow.camera.top = 35;
    moon.shadow.camera.bottom = -35;

    scene.add(moon);

    const cyan =
        new THREE.PointLight(
            0x00eaff,
            18,
            28
        );

    cyan.position.set(
        0,
        7,
        2
    );

    scene.add(cyan);

    const pink =
        new THREE.PointLight(
            0xff2fb3,
            12,
            30
        );

    pink.position.set(
        -10,
        6,
        -15
    );

    scene.add(pink);
}

/* ============================================================
   WORLD
   ============================================================ */

function setupWorld(){

    /* Ground */

    const ground =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                100,
                300
            ),
            new THREE.MeshStandardMaterial({
                color:0x080c19,
                roughness:.82,
                metalness:.15
            })
        );

    ground.rotation.x =
        -Math.PI / 2;

    ground.position.y = -0.5;
    ground.position.z = -80;

    ground.receiveShadow = true;

    scene.add(ground);

    /* Three railway tracks */

    for(let i=-1;i<=1;i++){

        createTrack(i);
    }

    /* Side platforms */

    createPlatform(-1);
    createPlatform(1);

    /* Buildings */

    for(let i=0;i<45;i++){

        createBuilding(
            i % 2 === 0 ? -1 : 1,
            -i * 8 - 15
        );
    }

    /* Metro lights */

    for(let i=0;i<30;i++){

        createStreetLight(
            -1,
            -i * 10 - 10
        );

        createStreetLight(
            1,
            -i * 10 - 10
        );
    }

    /* Neon signs */

    for(let i=0;i<14;i++){

        createNeonSign(
            i % 2 === 0 ? -1 : 1,
            -i * 22 - 25
        );
    }
}

/* ============================================================
   TRACK
   ============================================================ */

function createTrack(index){

    const x =
        index * 3.1;

    const railMat =
        new THREE.MeshStandardMaterial({
            color:0x7c8aa4,
            metalness:.85,
            roughness:.25
        });

    const darkMat =
        new THREE.MeshStandardMaterial({
            color:0x171c2d,
            roughness:.75
        });

    /* sleepers */

    for(let z=0;z>-280;z-=3){

        const sleeper =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    2.75,
                    .16,
                    .45
                ),
                darkMat
            );

        sleeper.position.set(
            x,
            -.35,
            z
        );

        sleeper.receiveShadow = true;

        scene.add(sleeper);
    }

    /* rails */

    for(const rx of [-1.02,1.02]){

        const rail =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .11,
                    .16,
                    300
                ),
                railMat
            );

        rail.position.set(
            x + rx,
            -.16,
            -130
        );

        rail.castShadow = true;

        scene.add(rail);
    }

    /* glowing center marker */

    const line =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .035,
                .035,
                300
            ),
            new THREE.MeshBasicMaterial({
                color:0x00dfff
            })
        );

    line.position.set(
        x,
        -.06,
        -130
    );

    scene.add(line);
}

/* ============================================================
   PLATFORM
   ============================================================ */

function createPlatform(side){

    const platform =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3.2,
                .5,
                300
            ),
            new THREE.MeshStandardMaterial({
                color:0x11182a,
                roughness:.7
            })
        );

    platform.position.set(
        side * 7.2,
        -.25,
        -130
    );

    platform.receiveShadow = true;

    scene.add(platform);

    const edge =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .12,
                .08,
                300
            ),
            new THREE.MeshBasicMaterial({
                color:0xffc928
            })
        );

    edge.position.set(
        side * 5.7,
        .04,
        -130
    );

    scene.add(edge);
}

/* ============================================================
   BUILDINGS
   ============================================================ */

function createBuilding(side,z){

    const height =
        4 +
        Math.random() * 13;

    const width =
        3 +
        Math.random() * 5;

    const depth =
        3 +
        Math.random() * 5;

    const mat =
        new THREE.MeshStandardMaterial({
            color:
                new THREE.Color().setHSL(
                    .62 + Math.random()*.07,
                    .28,
                    .09 + Math.random()*.08
                ),
            roughness:.82,
            metalness:.12
        });

    const building =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            mat
        );

    building.position.set(
        side * (10 + Math.random()*7),
        height/2 - .5,
        z
    );

    building.castShadow = true;

    scene.add(building);

    /* windows */

    const windowMat =
        new THREE.MeshBasicMaterial({
            color:
                Math.random()<.5
                    ? 0x00cfff
                    : 0xffc34d
        });

    for(let y=1;y<height-1;y+=1.7){

        for(let x=-width/2+.55;x<width/2-.3;x+=1.1){

            if(Math.random()<.55){

                const win =
                    new THREE.Mesh(
                        new THREE.BoxGeometry(
                            .25,
                            .45,
                            .035
                        ),
                        windowMat
                    );

                win.position.set(
                    building.position.x + x,
                    y,
                    z - depth/2 - .02
                );

                scene.add(win);
            }
        }
    }
}

/* ============================================================
   STREET LIGHT
   ============================================================ */

function createStreetLight(side,z){

    const group =
        new THREE.Group();

    group.position.set(
        side * 5.7,
        0,
        z
    );

    const pole =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .07,
                .1,
                5.5,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x59657d,
                metalness:.8
            })
        );

    pole.position.y=2.75;

    group.add(pole);

    const arm =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.3,
                .08,
                .08
            ),
            pole.material
        );

    arm.position.set(
        side * -.55,
        5.35,
        0
    );

    group.add(arm);

    const lamp =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .25,
                .12,
                .25
            ),
            new THREE.MeshBasicMaterial({
                color:0x8ff5ff
            })
        );

    lamp.position.set(
        side * -1.15,
        5.28,
        0
    );

    group.add(lamp);

    const light =
        new THREE.PointLight(
            0x7cefff,
            7,
            11
        );

    light.position.set(
        side * -1.15,
        5.1,
        0
    );

    group.add(light);

    scene.add(group);
}

/* ============================================================
   NEON SIGN
   ============================================================ */

function createNeonSign(side,z){

    const group =
        new THREE.Group();

    group.position.set(
        side * 7,
        2.8,
        z
    );

    const frame =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.7,
                1.15,
                .15
            ),
            new THREE.MeshStandardMaterial({
                color:0x101529,
                metalness:.6
            })
        );

    group.add(frame);

    const sign =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                2.35,
                .82
            ),
            new THREE.MeshBasicMaterial({
                color:
                    Math.random()<.5
                        ? 0x00eaff
                        : 0xff3cab
            })
        );

    sign.position.z=.09;

    if(side>0)
        sign.rotation.y=Math.PI;

    group.add(sign);

    scene.add(group);
}

/* ============================================================
   PLAYER
   ============================================================ */

function createPlayer(){

    player =
        new THREE.Group();

    player.position.set(
        0,
        0,
        4
    );

    scene.add(player);

    /* Legs */

    const legMat =
        new THREE.MeshStandardMaterial({
            color:0x202b49,
            roughness:.5
        });

    const skinMat =
        new THREE.MeshStandardMaterial({
            color:0xc98769,
            roughness:.75
        });

    const shoeMat =
        new THREE.MeshStandardMaterial({
            color:0xffffff,
            roughness:.3
        });

    const hoodieMat =
        new THREE.MeshStandardMaterial({
            color:0x13bfe8,
            roughness:.5,
            metalness:.05
        });

/* ============================================================
   TRAIN
   ============================================================ */

function createTrain(laneIndex,z){

    const train =
        new THREE.Group();

    train.position.set(
        laneIndex * 3.1,
        0,
        z
    );

    const bodyMat =
        new THREE.MeshStandardMaterial({
            color:0x27314d,
            metalness:.7,
            roughness:.28
        });

    const lowerMat =
        new THREE.MeshStandardMaterial({
            color:0x0d1325,
            metalness:.7,
            roughness:.3
        });

    const neonMat =
        new THREE.MeshStandardMaterial({
            color:0x19e7ff,
            emissive:0x075c70,
            emissiveIntensity:2
        });

    /* Main train */

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.55,
                2.35,
                7.2
            ),
            bodyMat
        );

    body.position.y=1.15;
    body.castShadow=true;

    train.add(body);

    /* Lower section */

    const lower =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.68,
                .45,
                7.25
            ),
            lowerMat
        );

    lower.position.y=.35;

    train.add(lower);

    /* Front */

    const front =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.25,
                1.55,
                .18
            ),
            new THREE.MeshStandardMaterial({
                color:0x17213c,
                metalness:.8
            })
        );

    front.position.set(
        0,
        1.25,
        -3.65
    );

    train.add(front);

    /* Windshield */

    const glass =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.7,
                .7,
                .05
            ),
            new THREE.MeshStandardMaterial({
                color:0x071b34,
                metalness:.8,
                roughness:.05,
                emissive:0x062038
            })
        );

    glass.position.set(
        0,
        1.65,
        -3.76
    );

    train.add(glass);

    /* Windows */

    for(let side of [-1,1]){

        for(let i=-2;i<=2;i++){

            const window =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .8,
                        .58,
                        .04
                    ),
                    new THREE.MeshStandardMaterial({
                        color:0x0b2841,
                        metalness:.7,
                        roughness:.08,
                        emissive:0x041321
                    })
                );

            window.position.set(
                side * 1.29,
                1.7,
                i * 1.2
            );

            window.rotation.y =
                Math.PI/2;

            train.add(window);
        }
    }

    /* Neon strip */

    const strip =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.4,
                .07,
                7
            ),
            neonMat
        );

    strip.position.y=1.1;

    train.add(strip);

    /* Headlights */

    for(let x of [-.65,.65]){

        const lightMesh =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .13,
                    12,
                    12
                ),
                new THREE.MeshBasicMaterial({
                    color:0xffffff
                })
            );

        lightMesh.position.set(
            x,
            .95,
            -3.78
        );

        train.add(lightMesh);

        const light =
            new THREE.PointLight(
                0xffffff,
                4,
                8
            );

        light.position.copy(
            lightMesh.position
        );

        train.add(light);
    }

    scene.add(train);

    trains.push({
        mesh:train,
        lane:laneIndex,
        z:z,
        dead:false
    });
}

/* ============================================================
   BARRIER
   ============================================================ */

function createBarrier(laneIndex,z){

    const group =
        new THREE.Group();

    group.position.set(
        laneIndex * 3.1,
        0,
        z
    );

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.25,
                .8,
                .5
            ),
            new THREE.MeshStandardMaterial({
                color:0xff334f,
                roughness:.5
            })
        );

    body.position.y=.45;

    body.castShadow=true;

    group.add(body);

    for(let x of [-.7,0,.7]){

        const stripe =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .2,
                    .9,
                    .53
                ),
                new THREE.MeshStandardMaterial({
                    color:0xffffff
                })
            );

        stripe.position.set(
            x,
            .45,
            0
        );

        stripe.rotation.z=.5;

        group.add(stripe);

    obstacles.push({

        lane:laneIndex,
        z:z,

/* ============================================================
   COIN
   ============================================================ */

function createCoin(laneIndex,z,y=1.35){

    const material =
        new THREE.MeshStandardMaterial({
            color:0xffd52f,
            metalness:.8,
            roughness:.18,
            emissive:0x5b3c00,
            emissiveIntensity:.6
        });

    const mesh =
        new THREE.Mesh(
            new THREE.TorusGeometry(
                .28,
                .075,
                12,
                24
            ),
            material
        );

    mesh.position.set(
        laneIndex * 3.1,
        y,
        z
    );

    mesh.rotation.y=
        Math.PI/2;

    mesh.castShadow=true;

    scene.add(mesh);

    coins.push({
        mesh,
        lane:laneIndex,
        z,
        baseY:y,
        dead:false
    });
}

/* ============================================================
   SPAWN COINS
   ============================================================ */

function spawnCoins(){

    const l =
        Math.floor(
            Math.random()*3
        )-1;

    const count =
        4+
        Math.floor(
            Math.random()*4
        );

    for(let i=0;i<count;i++){

        createCoin(
            l,
            -65-i*2.4,
            1.3 +
            Math.sin(i*.7)*.25
        );
    }
}

/* ============================================================
   OBSTACLE SPAWN
   ============================================================ */

function spawnObstacle(){

    const l =
        Math.floor(
            Math.random()*3
        )-1;

    if(Math.random()<.38){

        createTrain(
            l,
            -75
        );

    }else{

        createBarrier(
            l,
            -75
        );
    }
}

/* ============================================================
   PARTICLES
   ============================================================ */

function particleBurst(position,color){

    for(let i=0;i<15;i++){

        const geo =
            new THREE.SphereGeometry(
                .045+
                Math.random()*.05,
                5,
                5
            );

        const mat =
            new THREE.MeshBasicMaterial({
                color
            });

        const mesh =
            new THREE.Mesh(
                geo,
                mat
            );

        mesh.position.copy(position);

        scene.add(mesh);

        particles.push({
            mesh,
            life:1,
            velocity:new THREE.Vector3(
                (Math.random()-.5)*.08,
                Math.random()*.12,
                (Math.random()-.5)*.08
            )
        });
    }
}

function updateParticles(dt){

    for(const p of particles){

        p.mesh.position.addScaledVector(
            p.velocity,
            dt*60
        );

        p.velocity.y -=
            .004*dt*60;

        p.life -=
            dt*1.8;

        p.mesh.scale.setScalar(
            Math.max(0,p.life)
        );
    }

    particles =
        particles.filter(p=>{

            if(p.life<=0){

                scene.remove(p.mesh);

                return false;
            }

            return true;
        });
}

/* ============================================================
   GAME START
   ============================================================ */

function startGame(){

    gameState="PLAYING";

    score=0;
    coinCount=0;
    distance=0;

    speed=.42;
    difficulty=0;

    lane=0;
    targetLane=0;

    playerY=0;
    verticalVelocity=0;
    jumping=false;

    player.position.set(
        0,
        0,
        4
    );

    trains.forEach(x=>scene.remove(x.mesh));
    obstacles.forEach(x=>scene.remove(x.mesh));
    coins.forEach(x=>scene.remove(x.mesh));

    trains=[];
    obstacles=[];
    coins=[];

    document.getElementById("menu").style.opacity="0";
    document.getElementById("menu").style.pointerEvents="none";

    document.getElementById("hud").classList.add("show");

    document.getElementById("pauseOverlay")
        .classList.remove("show");

    document.getElementById("gameOver")
        .classList.remove("show");

    clock.start();
}

/* ============================================================
   PLAYER MOVEMENT
   ============================================================ */

function moveLeft(){

    if(gameState!=="PLAYING")
        return;

    targetLane =
        Math.max(
            -1,
            targetLane-1
        );
}

function moveRight(){

    if(gameState!=="PLAYING")
        return;

    targetLane =
        Math.min(
            1,
            targetLane+1
        );
}

function jump(){

    if(gameState!=="PLAYING")
        return;

    if(!jumping){

        jumping=true;

        verticalVelocity=.19;
    }
}

/* ============================================================
   GAME UPDATE
   ============================================================ */

function update(dt){

    difficulty += dt;

    speed =
        Math.min(
            1.0,
            .42+
            difficulty*.007
        );

    score +=
        speed*
        dt*
        22;

    distance +=
        speed*
        dt*
        25;

    /* lane movement */

    const targetX =
        targetLane*3.1;

    player.position.x +=
        (targetX-player.position.x)*
        Math.min(1,dt*13);

    /* jump */

    if(jumping){

        playerY +=
            verticalVelocity*
            dt*
            60;

        verticalVelocity -=
            .011*
            dt*
            60;

        if(playerY<=0){

            playerY=0;
            verticalVelocity=0;
            jumping=false;
        }
    }

    player.position.y=playerY;

    /* running animation */

    const t =
        performance.now()*.012;

    const run =
        Math.sin(t*speed*2.8);

    playerParts.leftLeg.rotation.x =
        run*.65;

    playerParts.rightLeg.rotation.x =
        -run*.65;

    playerParts.leftArm.rotation.x =
        -run*.5;

    playerParts.rightArm.rotation.x =
        run*.5;

    player.position.y +=
        Math.abs(run)*.025;

    /* spawn */

    spawnTimer -= dt;

    if(spawnTimer<=0){

        spawnObstacle();

        spawnTimer =
            Math.max(
                .65,
                1.35-
                difficulty*.006
            );
    }

    coinTimer -= dt;

    if(coinTimer<=0){

        spawnCoins();

        coinTimer=1.4;
    }

    /* trains */

    for(const train of trains){

        train.z +=
            speed*
            dt*
            14;

        train.mesh.position.z =
            train.z;

        if(train.z>12)
            train.dead=true;
    }

    trains =
        trains.filter(t=>{

            if(t.dead){

                scene.remove(t.mesh);

                return false;
            }

            return true;
        });

    /* barriers */

    for(const o of obstacles){

        o.z +=
            speed*
            dt*
            14;

        o.mesh.position.z =
            o.z;

        if(o.z>12)
            o.dead=true;
    }

    obstacles =
        obstacles.filter(o=>{

            if(o.dead){

                scene.remove(o.mesh);

                return false;
            }

            return true;
        });

    /* coins */

    for(const c of coins){

        c.z +=
            speed*
            dt*
            14;

        c.mesh.position.z =
            c.z;

        c.mesh.rotation.z +=
            dt*6;

        c.mesh.position.y =
            c.baseY+
            Math.sin(
                performance.now()*.004+
                c.z
            )*.08;

        if(c.z>10)
            c.dead=true;

        /* collection */

        const dx =
            Math.abs(
                c.mesh.position.x-
                player.position.x
            );

        const dz =
            Math.abs(
                c.z-
                player.position.z
            );

        const dy =
            Math.abs(
                c.mesh.position.y-
                (player.position.y+1.2)
            );

        if(
            dx<1.0 &&
            dz<1.3 &&
            dy<1.5
        ){

            c.dead=true;

            coinCount++;
            score+=50;

            particleBurst(
                c.mesh.position,
                0xffd52f
            );
        }
    }

    coins =
        coins.filter(c=>{

            if(c.dead){

                scene.remove(c.mesh);

                return false;
            }

            return true;
        });

    /* collisions */

    checkCollisions();

    updateParticles(dt);

    /* camera */

    camera.position.x +=
        (player.position.x*.42-
        camera.position.x)*
        Math.min(1,dt*5);

    camera.position.y +=
        (5.1+
        playerY*.35-
        camera.position.y)*
        Math.min(1,dt*4);

    camera.lookAt(
        player.position.x*.35,
        1.15+playerY*.3,
        -6
    );

    /* HUD */

    document.getElementById("score")
        .textContent =
        Math.floor(score).toLocaleString();

    document.getElementById("coins")
        .textContent =
        coinCount;

    document.getElementById("distance")
        .textContent =
        Math.floor(distance)+"m";

    document.getElementById("speedFill")
        .style.width =
        Math.min(
            100,
            12+
            difficulty*.45
        )+"%";
}

/* ============================================================
   COLLISION
   ============================================================ */

function checkCollisions(){

    for(const train of trains){

        if(
            Math.abs(
                train.z-
                player.position.z
            )<2.7 &&
            Math.abs(
                train.mesh.position.x-
                player.position.x
            )<1.3
        ){

            gameOver();
            return;
        }
    }

    for(const o of obstacles){

        if(
            Math.abs(
                o.z-
                player.position.z
            )<1.45 &&
            Math.abs(
                o.mesh.position.x-
                player.position.x
            )<1.2 &&
            playerY<1.05
        ){

            gameOver();
            return;
        }
    }
}

/* ============================================================
   GAME OVER
   ============================================================ */

function gameOver(){

    if(gameState!=="PLAYING")
        return;

    gameState="GAMEOVER";

    particleBurst(
        player.position,
        0xff3c6f
    );

    const final =
        Math.floor(score);

    if(final>bestScore){

        bestScore=final;

        localStorage.setItem(
            "metroRush3DBest",
            bestScore
        );
    }

    if(coinCount>bestCoins){

        bestCoins=coinCount;

        localStorage.setItem(
            "metroRush3DCoins",
            bestCoins
        );
    }

    document.getElementById("finalScore")
        .textContent =
        final.toLocaleString();

    document.getElementById("finalCoins")
        .textContent =
        coinCount;

    document.getElementById("finalDistance")
        .textContent =
        Math.floor(distance)+"m";

    document.getElementById("finalBest")
        .textContent =
        bestScore.toLocaleString();

    document.getElementById("gameOver")
        .classList.add("show");
}

/* ============================================================
   PAUSE
   ============================================================ */

function pauseGame(){

    if(gameState!=="PLAYING")
        return;

    gameState="PAUSED";

    document.getElementById("pauseOverlay")
        .classList.add("show");
}

function resumeGame(){

    if(gameState!=="PAUSED")
        return;

    gameState="PLAYING";

    document.getElementById("pauseOverlay")
        .classList.remove("show");

    clock.start();
}

function home(){

    gameState="HOME";

    document.getElementById("gameOver")
        .classList.remove("show");

    document.getElementById("pauseOverlay")
        .classList.remove("show");

    document.getElementById("hud")
        .classList.remove("show");

    document.getElementById("menu")
        .style.opacity="1";

    document.getElementById("menu")
        .style.pointerEvents="auto";
}

/* ============================================================
   INPUT
   ============================================================ */

window.addEventListener(
    "keydown",
    e=>{

        if(e.code==="ArrowLeft"){

            e.preventDefault();
            moveLeft();

        }else if(e.code==="ArrowRight"){

            e.preventDefault();
            moveRight();

        }else if(
            e.code==="ArrowUp" ||
            e.code==="Space"
        ){

            e.preventDefault();
            jump();

        }else if(e.code==="Escape"){

            if(gameState==="PLAYING")
                pauseGame();

            else if(gameState==="PAUSED")
                resumeGame();
        }
    }
);

/* ============================================================
   TOUCH
   ============================================================ */

let sx=0;
let sy=0;

rendererTouchSetup();

function rendererTouchSetup(){

    document.addEventListener(
        "touchstart",
        e=>{

            if(!e.changedTouches[0])
                return;

            sx=e.changedTouches[0].clientX;
            sy=e.changedTouches[0].clientY;
        },
        {passive:true}
    );

    document.addEventListener(
        "touchend",
        e=>{

            if(gameState!=="PLAYING")
                return;

            if(!e.changedTouches[0])
                return;

            const dx =
                e.changedTouches[0].clientX-sx;

            const dy =
                e.changedTouches[0].clientY-sy;

            if(
                Math.abs(dx)>
                Math.abs(dy)
            ){

                if(Math.abs(dx)>35){

                    if(dx>0)
                        moveRight();
                    else
                        moveLeft();
                }

            }else{

                if(dy<-35)
                    jump();
            }
        },
        {passive:true}
    );
}

/* ============================================================
   BUTTONS
   ============================================================ */

document.getElementById("play")
    .onclick=startGame;

document.getElementById("pause")
    .onclick=pauseGame;

document.getElementById("resume")
    .onclick=resumeGame;

document.getElementById("pauseRestart")
    .onclick=startGame;

document.getElementById("restart")
    .onclick=startGame;

document.getElementById("home")
    .onclick=home;

/* ============================================================
   RESIZE
   ============================================================ */

function resize(){

    camera.aspect =
        window.innerWidth/
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );
}

/* ============================================================
   ANIMATION
   ============================================================ */

function animate(){

    requestAnimationFrame(animate);

    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );

    if(gameState==="PLAYING")
        update(dt);

    renderer.render(
        scene,
        camera
    );
}

/* ============================================================
   START
   ============================================================ */

init();

</script>
