<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Metro Rush: Urban Escape</title>
    <style>
        :root {
            --primary: #ff6b35;
            --secondary: #00d4ff;
            --accent: #ffd700;
            --bg-dark: #0a0a12;
            --bg-panel: #151525;
            --text: #ffffff;
            --text-muted: #a0a0b8;
            --danger: #ff3355;
            --success: #33ff88;
            --warning: #ffaa33;
            --radius: 16px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-dark);
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
            touch-action: none;
            position: fixed;
            inset: 0;
        }

        canvas#gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .ui-overlay {
            position: absolute;
            z-index: 10;
            pointer-events: none;
        }
        .ui-overlay>* {
            pointer-events: auto;
        }

        #hud {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px 16px;
        }
        #hud.active {
            display: flex;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            flex-wrap: wrap;
        }
        .hud-stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .hud-stat {
            background: rgba(10, 10, 18, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }
        .hud-stat .icon {
            font-size: 18px;
        }
        .hud-stat.coins {
            color: var(--accent);
            border-color: rgba(255, 215, 0, 0.4);
        }
        .hud-stat.score {
            color: var(--secondary);
            border-color: rgba(0, 212, 255, 0.4);
        }
        .hud-stat.distance {
            color: #ff88cc;
            border-color: rgba(255, 136, 204, 0.4);
        }
        .hud-stat.speed {
            color: var(--primary);
            border-color: rgba(255, 107, 53, 0.4);
        }

        .btn {
            border: none;
            border-radius: 12px;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.2s;
            pointer-events: auto;
            text-transform: uppercase;
            font-family: inherit;
            outline: none;
            position: relative;
            overflow: hidden;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #ff4500);
            color: #fff;
            box-shadow: 0 4px 16px rgba(255, 107, 53, 0.4);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 24px rgba(255, 107, 53, 0.6);
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #cc0033);
            color: #fff;
            box-shadow: 0 4px 16px rgba(255, 51, 85, 0.4);
        }
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 8px;
        }
        .btn-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            padding: 0;
            background: rgba(10, 10, 18, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(8px);
        }
        .btn-icon:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.2);
        }

        #pauseBtn {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 20;
        }

        #mainMenu {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: radial-gradient(ellipse at center, rgba(20, 20, 40, 0.9) 0%, rgba(10, 10, 18, 0.98) 100%);
            z-index: 30;
            pointer-events: auto;
        }
        #mainMenu.hidden {
            display: none;
        }
        .menu-title {
            font-size: clamp(32px, 7vw, 56px);
            font-weight: 900;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1.1;
            background: linear-gradient(135deg, var(--primary), var(--accent), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 4px 20px rgba(255, 107, 53, 0.5));
        }
        .menu-subtitle {
            font-size: 16px;
            color: var(--text-muted);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: -8px;
        }
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: min(280px, 80vw);
            margin-top: 10px;
        }
        .menu-buttons .btn {
            padding: 14px 24px;
            font-size: 17px;
            border-radius: 14px;
        }
        .menu-character-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 3px solid rgba(255, 107, 53, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            margin-bottom: 8px;
            animation: pulse-glow 2s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(255, 107, 53, 0.3);
            }
            50% {
                box-shadow: 0 0 40px rgba(255, 107, 53, 0.6);
            }
        }
        .menu-stats-row {
            display: flex;
            gap: 16px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .menu-stats-row span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #gameOverScreen {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: rgba(10, 10, 18, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 30;
            pointer-events: auto;
        }
        #gameOverScreen.active {
            display: flex;
        }
        .game-over-title {
            font-size: 36px;
            font-weight: 900;
            color: var(--danger);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 4px 20px rgba(255, 51, 85, 0.5);
        }
        .game-over-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: min(320px, 80vw);
        }
        .game-over-stat {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
        }
        .game-over-stat .value {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            display: block;
            margin-top: 4px;
        }
        .game-over-stat .value.coins {
            color: var(--accent);
        }
        .game-over-stat .value.score {
            color: var(--secondary);
        }
        .game-over-stat .value.distance {
            color: #ff88cc;
        }
        .game-over-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #pauseOverlay {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: rgba(10, 10, 18, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 25;
            pointer-events: auto;
        }
        #pauseOverlay.active {
            display: flex;
        }
        .pause-title {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 2px;
        }

        #shopScreen {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: rgba(10, 10, 18, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 30;
            pointer-events: auto;
            padding: 20px;
        }
        #shopScreen.active {
            display: flex;
        }
        .shop-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 1px;
        }
        .shop-items {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 400px;
        }
        .shop-item {
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s;
            min-width: 100px;
        }
        .shop-item:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .shop-item.selected {
            border-color: var(--accent);
            background: rgba(255, 215, 0, 0.15);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        .shop-item .emoji {
            font-size: 36px;
            display: block;
            margin-bottom: 6px;
        }
        .shop-item .name {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }
        .shop-item .cost {
            font-size: 12px;
            color: var(--accent);
            margin-top: 4px;
        }

        .toast {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 18, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            z-index: 40;
            pointer-events: none;
            animation: toast-in 0.3s ease-out, toast-out 0.4s ease-in 1.8s forwards;
            white-space: nowrap;
            backdrop-filter: blur(8px);
        }
        @keyframes toast-in {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        @keyframes toast-out {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
                transform: translateX(-50%) translateY(-10px);
            }
        }

        .combo-text {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: 900;
            color: var(--accent);
            z-index: 15;
            pointer-events: none;
            animation: combo-pop 0.5s ease-out forwards;
            text-shadow: 0 4px 16px rgba(255, 215, 0, 0.7);
        }
        @keyframes combo-pop {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            40% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -60%) scale(1);
            }
        }

        .powerup-indicator {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            display: flex;
            gap: 6px;
            pointer-events: none;
        }
        .powerup-badge {
            background: rgba(10, 10, 18, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            animation: badge-glow 1s ease-in-out infinite;
            backdrop-filter: blur(6px);
        }
        @keyframes badge-glow {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
            }
            50% {
                box-shadow: 0 0 16px rgba(255, 255, 255, 0.5);
            }
        }

        @media (max-width: 480px) {
            .hud-stat {
                font-size: 12px;
                padding: 4px 10px;
                border-radius: 8px;
            }
            .hud-stat .icon {
                font-size: 14px;
            }
            .menu-title {
                font-size: 28px;
            }
            .game-over-title {
                font-size: 26px;
            }
            .btn {
                padding: 8px 16px;
                font-size: 13px;
                border-radius: 10px;
            }
            .menu-buttons .btn {
                padding: 12px 18px;
                font-size: 15px;
            }
            .shop-item {
                min-width: 80px;
                padding: 10px;
            }
            .shop-item .emoji {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud" class="ui-overlay">
        <div class="hud-top">
            <div class="hud-stats">
                <div class="hud-stat coins"><span class="icon">🪙</span><span id="hudCoins">0</span></div>
                <div class="hud-stat score"><span class="icon">⭐</span><span id="hudScore">0</span></div>
                <div class="hud-stat distance"><span class="icon">📏</span><span id="hudDistance">0m</span></div>
                <div class="hud-stat speed"><span class="icon">⚡</span
