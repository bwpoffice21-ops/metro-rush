<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>METRO RUN - 3D Endless Subway Runner</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            max-height: 900px;
            background: #000;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* UI OVERLAYS */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            box-sizing: border-box;
        }
        
        .interactive {
            pointer-events: auto;
        }

        .hidden {
            display: none !important;
        }

        /* BUTTON STYLES */
        .btn {
            background: linear-gradient(180deg, #FF9D00 0%, #FF5500 100%);
            border: 3px solid #FFF;
            border-radius: 12px;
            color: #FFF;
            font-size: 20px;
            font-weight: 900;
            padding: 12px 24px;
            text-shadow: 2px 2px 0px #000;
            box-shadow: 0 6px 0 #992200, 0 8px 10px rgba(0,0,0,0.4);
            cursor: pointer;
            text-transform: uppercase;
            text-align: center;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #992200, 0 3px 5px rgba(0,0,0,0.4);
        }
        .btn-blue {
            background: linear-gradient(180deg, #00C6FF 0%, #0072FF 100%);
            box-shadow: 0 6px 0 #0040A0, 0 8px 10px rgba(0,0,0,0.4);
        }
        .btn-blue:active {
            box-shadow: 0 2px 0 #0040A0, 0 3px 5px rgba(0,0,0,0.4);
        }
        .btn-green {
            background: linear-gradient(180deg, #00FF87 0%, #60EFFF 100%);
            color: #005020;
            text-shadow: none;
            box-shadow: 0 6px 0 #008040, 0 8px 10px rgba(0,0,0,0.4);
        }
        .btn-green:active {
            box-shadow: 0 2px 0 #008040, 0 3px 5px rgba(0,0,0,0.4);
        }
        .btn-small {
            padding: 6px 12px;
            font-size: 14px;
            border-radius: 8px;
        }

        /* MENU PANELS */
        .panel {
            background: rgba(20, 20, 35, 0.9);
            border: 4px solid #FFD700;
            border-radius: 20px;
            padding: 20px;
            color: white;
            text-align: center;
            max-width: 90%;
            margin: auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            pointer-events: auto;
        }
        .panel-title {
            font-size: 28px;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 2px 2px 0 #000;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        /* HUD ELEMENTS */
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }
        .hud-card {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 6px 12px;
            color: white;
            font-weight: 800;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 1px 1px 0 #000;
        }
        .hud-card span {
            color: #FFD700;
        }
        .score-display {
            font-size: 28px;
            font-weight: 900;
            color: #FFF;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            text-align: center;
        }

        /* ACTIVE POWERUPS CONTAINER */
        .powerup-list {
            position: absolute;
            top: 70px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .powerup-item {
            background: rgba(0,0,0,0.7);
            border: 2px solid #00E5FF;
            border-radius: 8px;
            padding: 4px 8px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100px;
        }
        .powerup-bar {
            height: 4px;
            background: #00E5FF;
            border-radius: 2px;
            width: 100%;
            transition: width 0.1s linear;
        }

        /* TOUCH CONTROLS */
        .touch-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .touch-btn {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            pointer-events: auto;
        }

        /* SHOP & MISSION LISTS */
        .scroll-list {
            max-height: 250px;
            overflow-y: auto;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }
        .list-item {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .list-item-title {
            font-weight: bold;
            color: #FFD700;
            text-align: left;
        }
        .list-item-desc {
            font-size: 12px;
            color: #DDD;
            text-align: left;
        }

        .board-btn {
            position: absolute;
            bottom: 90px;
            right: 20px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF007F, #7928CA);
            border: 3px solid #FFF;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
            pointer-events: auto;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- MAIN MENU OVERLAY -->
        <div id="menu-overlay" class="ui-layer">
            <div class="hud-top">
                <div class="hud-card">🪙 <span id="menu-coins">0</span></div>
                <div class="hud-card">🏆 BEST: <span id="menu-highscore">0</span></div>
            </div>
            
            <div style="text-align: center; margin-top: 40px;">
                <h1 style="font-size: 48px; color: #FFD700; text-shadow: 3px 3px 0 #FF5500, 6px 6px 0 #000; font-weight: 900; letter-spacing: 2px;">METRO RUN</h1>
                <p style="color: #FFF; text-shadow: 1px 1px 0 #000; font-weight: bold;">SUBWAY SURF STYLE ENDLESS RUNNER</p>
            </div>

            <div style="display: flex; flex-direction: column; gap: 12px; width: 80%; margin: 0 auto 30px auto;" class="interactive">
                <button class="btn" id="btn-play">PLAY NOW</button>
                <button class="btn btn-blue" id="btn-shop">SHOP</button>
                <button class="btn btn-blue" id="btn-missions">MISSIONS</button>
                <button class="btn btn-blue" id="btn-settings">SETTINGS</button>
            </div>
        </div>

        <!-- HUD OVERLAY (PLAYING) -->
        <div id="hud-overlay" class="ui-layer hidden">
            <div class="hud-top">
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <div class="hud-card">🪙 <span id="hud-coins">0</span></div>
                    <div class="hud-card" style="font-size: 12px;">📅 TODAY: <span id="hud-daily">0</span></div>
                </div>
                <div>
                    <div class="score-display" id="hud-score">0</div>
                    <div style="font-size: 12px; color: #FFF; text-align: right; text-shadow: 1px 1px 0 #000;">MULTIPLIER x<span id="hud-mult">1</span></div>
                </div>
                <div class="hud-card interactive" id="btn-pause" style="cursor: pointer;">⏸️</div>
            </div>

            <div class="powerup-list" id="powerup-list"></div>

            <div class="board-btn hidden" id="btn-board">HOVER<br>BOARD</div>

            <!-- Touch Controls (Mobile) -->
            <div class="touch-controls hidden" id="touch-controls">
                <div style="display: flex; gap: 10px;">
                    <div class="touch-btn" id="t-left">⬅️</div>
                    <div class="touch-btn" id="t-right">➡️</div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="touch-btn" id="t-down">⬇️</div>
                    <div class="touch-btn" id="t-up">⬆️</div>
                </div>
            </div>
        </div>

        <!-- PAUSE MENU -->
        <div id="pause-overlay" class="ui-layer hidden" style="background: rgba(0,0,0,0.7);">
            <div class="panel">
                <div class="panel-title">GAME PAUSED</div>
                <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
                    <button class="btn btn-green" id="btn-resume">RESUME</button>
                    <button class="btn" id="btn-restart-pause">RESTART</button>
                    <button class="btn btn-blue" id="btn-quit">MAIN MENU</button>
                </div>
            </div>
        </div>

        <!-- GAME OVER OVERLAY -->
        <div id="gameover-overlay" class="ui-layer hidden" style="background: rgba(0,0,0,0.85);">
            <div class="panel">
                <div class="panel-title" style="color: #FF3333;">GAME OVER</div>
                
                <div style="margin: 15px 0; font-size: 18px; line-height: 1.6;">
                    <div>SCORE: <b id="go-score" style="color: #FFF;">0</b></div>
                    <div>COINS COLLECTED: <b id="go-coins" style="color: #FFD700;">0</b></div>
                    <div>BEST SCORE: <b id="go-highscore" style="color: #00FF87;">0</b></div>
                </div>

                <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
                    <button class="btn" id="btn-playagain">PLAY AGAIN</button>
                    <button class="btn btn-blue" id="btn-shop-go">SHOP</button>
                    <button class="btn btn-blue" id="btn-home">MAIN MENU</button>
                </div>
            </div>
        </div>

        <!-- SHOP OVERLAY -->
        <div id="shop-overlay" class="ui-layer hidden" style="background: rgba(0,0,0,0.85);">
            <div class="panel" style="width: 100%;">
                <div class="panel-title">METRO SHOP</div>
                <div class="hud-card" style="display: inline-flex; margin-bottom: 10px;">🪙 COINS: <span id="shop-coins">0</span></div>
                
                <div class="scroll-list" id="shop-list"></div>

                <button class="btn btn-blue" id="btn-shop-close">BACK</button>
            </div>
        </div>

        <!-- MISSIONS OVERLAY -->
        <div id="missions-overlay" class="ui-layer hidden" style="background: rgba(0,0,0,0.85);">
            <div class="panel" style="width: 100%;">
                <div class="panel-title">MISSIONS</div>
                
                <div class="scroll-list" id="missions-list"></div>

                <button class="btn btn-blue" id="btn-missions-close">BACK</button>
            </div>
        </div>

        <!-- SETTINGS OVERLAY -->
        <div id="settings-overlay" class="ui-layer hidden" style="background: rgba(0,0,0,0.85);">
            <div class="panel">
                <div class="panel-title">SETTINGS</div>
                
                <div style="display: flex; flex-direction: column; gap: 15px; margin: 20px 0; text-align: left;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span>SOUND EFFECTS</span>
                        <button class="btn btn-small btn-blue" id="btn-toggle-sound">ON</button>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span>TOUCH BUTTONS</span>
                        <button class="btn btn-small btn-blue" id="btn-toggle-touch">OFF</button>
                    </div>
                </div>

                <button class="btn btn-blue" id="btn-settings-close">BACK</button>
            </div>
        </div>

    </div>

    <script>
        /* ==========================================================================
           AUDIO SYNTHESIZER (Web Audio API)
           ========================================================================== */
        class SoundSystem {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playCoin() {
                if (!this.enabled || !this.ctx) return;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, this.ctx.currentTime); // B5
                osc.frequency.setValueAtTime(1318.51, this.ctx.currentTime + 0.08); // E6
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }

            playJump() {
                if (!this.enabled || !this.ctx) return;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playPowerup() {
                if (!this.enabled || !this.ctx) return;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(600, this.ctx.currentTime + 0.1);
                osc.frequency.linearRampToValueAtTime(900, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            playHit() {
                if (!this.enabled || !this.ctx) return;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            playClick() {
                if (!this.enabled || !this.ctx) return;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            }
        }

        const audio = new SoundSystem();

        /* ==========================================================================
           GAME ENGINE & PERSPECTIVE RENDERER
           ========================================================================== */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Storage Data
        let storage = {
            coins: parseInt(localStorage.getItem('mr_coins')) || 0,
            highScore: parseInt(localStorage.getItem('mr_highscore')) || 0,
            dailyScore: parseInt(localStorage.getItem('mr_daily_score')) || 0,
            dailyDate: localStorage.getItem('mr_daily_date') || '',
            char: localStorage.getItem('mr_char') || 'kid',
            unlockedChars: JSON.parse(localStorage.getItem('mr_unlocked_chars')) || ['kid'],
            touchEnabled: localStorage.getItem('mr_touch') === 'true'
        };

        // Check daily reset
        const todayStr = new Date().toDateString();
        if (storage.dailyDate !== todayStr) {
            storage.dailyDate = todayStr;
            storage.dailyScore = 0;
            localStorage.setItem('mr_daily_date', todayStr);
            localStorage.setItem('mr_daily_score', '0');
        }

        function saveStorage() {
            localStorage.setItem('mr_coins', storage.coins);
            localStorage.setItem('mr_highscore', storage.highScore);
            localStorage.setItem('mr_daily_score', storage.dailyScore);
            localStorage.setItem('mr_char', storage.char);
            localStorage.setItem('mr_unlocked_chars', JSON.stringify(storage.unlockedChars));
            localStorage.setItem('mr_touch', storage.touchEnabled);
        }

        // Shop items database
        const CHARACTERS = {
            'kid': { name: 'Metro Kid', price: 0, color: '#FF5500', cap: '#333' },
            'runner': { name: 'Street Runner', price: 500, color: '#00E5FF', cap: '#FFF' },
            'neon': { name: 'Neon Rider', price: 1500, color: '#FF007F', cap: '#7928CA' }
        };

        // Missions system
        let missions = [
            { id: 'c50', desc: 'Collect 50 coins in one run', target: 50, current: 0, reward: 100, done: false },
            { id: 'd1000', desc: 'Run 1000 meters total', target: 1000, current: 0, reward: 150, done: false },
            { id: 'j20', desc: 'Jump 20 times', target: 20, current: 0, reward: 50, done: false }
        ];

        // Constants & Config
        const LANES = [-1.8, 0, 1.8]; // Virtual X positions for Left, Center, Right
        let state = 'MENU'; // MENU, PLAYING, PAUSED, GAMEOVER, SHOP, MISSIONS, SETTINGS
        let camera = { y: 2.2, z: -3.5, fov: 250 };
        let speed = 0;
        let baseSpeed = 0.35;
        let distance = 0;
        let score = 0;
        let runCoins = 0;
        let activePowerups = {};
        let hoverboardActive = false;
        let hoverboardTimer = 0;

        // Player state
        let player = {
            lane: 1, // 0: Left, 1: Center, 2: Right
            x: 0,
            y: 0,
            z: 0,
            targetX: 0,
            vy: 0,
            isJumping: false,
            isRolling: false,
            rollTimer: 0,
            animFrame: 0
        };

        // World Objects Pooling
        let trackObjects = [];
        let sceneryObjects = [];
        let particles = [];

        function resizeCanvas() {
            const container = document.getElementById('game-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Convert 3D world coordinates to 2D Canvas space
        function project(x, y, z) {
            let cz = z - camera.z;
            if (cz <= 0.1) cz = 0.1;
            let scale = camera.fov / cz;
            let px = (canvas.width / 2) + (x * scale);
            let py = (canvas.height * 0.55) - ((y - camera.y) * scale);
            return { x: px, y: py, scale: scale, depth: cz };
        }

        /* ==========================================================================
           OBJECT GENERATOR & WORLD BUILDER
           ========================================================================== */
        let spawnZ = 20;

        function spawnTrackSegment(z) {
            // Generate Scenery Left and Right
            if (Math.random() < 0.6) {
                sceneryObjects.push({
                    type: 'building',
                    side: -1,
                    x: -6 - Math.random() * 2,
                    y: 0,
                    z: z,
                    w: 4,
                    h: 8 + Math.random() * 6,
                    color: `hsl(${Math.random()*50 + 200}, 50%, 40%)`
                });
            }
            if (Math.random() < 0.6) {
                sceneryObjects.push({
                    type: 'building',
                    side: 1,
                    x: 6 + Math.random() * 2,
                    y: 0,
                    z: z,
                    w: 4,
                    h: 8 + Math.random() * 6,
                    color: `hsl(${Math.random()*50 + 200}, 50%, 40%)`
                });
            }

            // Trees and Lamp posts
            if (Math.random() < 0.3) {
                sceneryObjects.push({ type: 'tree', x: -4, y: 0, z: z });
            }
            if (Math.random() < 0.3) {
                sceneryObjects.push({ type: 'tree', x: 4, y: 0, z: z });
            }

            // Spawn Obstacles & Coins
            if (z > 30 && Math.random() < 0.45) {
                let laneIndex = Math.floor(Math.random() * 3);
                let typeRand = Math.random();

                if (typeRand < 0.35) {
                    // Train
                    trackObjects.push({
                        type: 'train',
                        lane: laneIndex,
                        x: LANES[laneIndex],
                        y: 0,
                        z: z,
                        w: 1.4,
                        h: 2.2,
                        length: 8,
                        moving: Math.random() < 0.3,
                        speed: 0.15
                    });
                } else if (typeRand < 0.65) {
                    // Barrier (Low or High)
                    let isHigh = Math.random() < 0.4;
                    trackObjects.push({
                        type: 'barrier',
                        high: isHigh,
                        lane: laneIndex,
                        x: LANES[laneIndex],
                        y: 0,
                        z: z,
                        w: 1.5,
                        h: isHigh ? 1.8 : 0.8
                    });
                } else if (typeRand < 0.8) {
                    // Powerup
                    const pTypes = ['magnet', 'shield', 'boost', 'double'];
                    const pType = pTypes[Math.floor(Math.random() * pTypes.length)];
                    trackObjects.push({
                        type: 'powerup',
                        powerType: pType,
                        lane: laneIndex,
                        x: LANES[laneIndex],
                        y: 0.8,
                        z: z
                    });
                }
            } else if (z > 15 && Math.random() < 0.5) {
                // Coins pattern
                let laneIndex = Math.floor(Math.random() * 3);
                let count = 3 + Math.floor(Math.random() * 4);
                for (let i = 0; i < count; i++) {
                    trackObjects.push({
                        type: 'coin',
                        lane: laneIndex,
                        x: LANES[laneIndex],
                        y: 0.6,
                        z: z + (i * 1.5)
                    });
                }
            }
        }

        /* ==========================================================================
           GAME LOOP & UPDATE LOGIC
           ========================================================================== */
        let lastTime = performance.now();

        function resetGame() {
            speed = baseSpeed;
            distance = 0;
            score = 0;
            runCoins = 0;
            activePowerups = {};
            hoverboardActive = false;
            hoverboardTimer = 0;

            player.lane = 1;
            player.x = LANES[1];
            player.targetX = LANES[1];
            player.y = 0;
            player.z = 0;
            player.vy = 0;
            player.isJumping = false;
            player.isRolling = false;

            trackObjects = [];
            sceneryObjects = [];
            particles = [];
            spawnZ = 20;

            for (let z = 10; z < 100; z += 4) {
                spawnTrackSegment(z);
            }

            updateHUD();
        }

        function startGame() {
            audio.init();
            resetGame();
            state = 'PLAYING';
            showOverlay('hud-overlay');
        }

        function triggerGameOver() {
            audio.playHit();
            state = 'GAMEOVER';

            // Save records
            storage.coins += runCoins;
            if (score > storage.highScore) storage.highScore = score;
            if (score > storage.dailyScore) storage.dailyScore = score;
            saveStorage();

            // Missions Check
            missions.forEach(m => {
                if (m.id === 'c50' && runCoins >= m.target) m.current = m.target;
                if (m.id === 'd1000') m.current += Math.floor(distance);
                if (m.current >= m.target && !m.done) {
                    m.done = true;
                    storage.coins += m.reward;
                }
            });
            saveStorage();

            document.getElementById('go-score').innerText = Math.floor(score);
            document.getElementById('go-coins').innerText = runCoins;
            document.getElementById('go-highscore').innerText = storage.highScore;

            showOverlay('gameover-overlay');
        }

        // Input Handling
        function moveLeft() {
            if (player.lane > 0) {
                player.lane--;
                player.targetX = LANES[player.lane];
                audio.playClick();
            }
        }
        function moveRight() {
            if (player.lane < 2) {
                player.lane++;
                player.targetX = LANES[player.lane];
                audio.playClick();
            }
        }
        function jump() {
            if (!player.isJumping) {
                player.vy = 0.22;
                player.isJumping = true;
                player.isRolling = false;
                audio.playJump();
                // Mission track
                let m = missions.find(x => x.id === 'j20');
                if (m && !m.done) m.current++;
            }
        }
        function roll() {
            if (!player.isRolling) {
                player.isRolling = true;
                player.rollTimer = 25;
                if (player.isJumping) {
                    player.vy = -0.25; // Fast fall
                }
                audio.playClick();
            }
        }

        function activateHoverboard() {
            if (!hoverboardActive && state === 'PLAYING') {
                hoverboardActive = true;
                hoverboardTimer = 300; // 5 seconds
                audio.playPowerup();
            }
        }

        // Keyboard Listener
        window.addEventListener('keydown', (e) => {
            if (state !== 'PLAYING') return;
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft();
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight();
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') jump();
            if (e.key === 'ArrowDown' || e.key === 's') roll();
            if (e.key === 'p' || e.key === 'P') pauseGame();
        });

        // Mobile Touch Swipes
        let touchStartX = 0;
        let touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        canvas.addEventListener('touchend', (e) => {
            if (state !== 'PLAYING') return;
            let dx = e.changedTouches[0].clientX - touchStartX;
            let dy = e.changedTouches[0].clientY - touchStartY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30) moveRight();
                else if (dx < -30) moveLeft();
            } else {
                if (dy < -30) jump();
                else if (dy > 30) roll();
            }
        }, { passive: true });

        // Update loop
        function update(dt) {
            if (state !== 'PLAYING') return;

            // Speed progression
            speed = baseSpeed + (distance * 0.00005);
            let currentSpeed = speed;

            if (activePowerups['boost']) currentSpeed *= 1.8;

            distance += currentSpeed;
            let mult = activePowerups['double'] ? 2 : 1;
            score += currentSpeed * 2 * mult;

            // Smooth horizontal movement
            player.x += (player.targetX - player.x) * 0.2;

            // Jump & Gravity
            if (player.isJumping) {
                player.y += player.vy;
                player.vy -= 0.012; // Gravity
                if (player.y <= 0) {
                    player.y = 0;
                    player.isJumping = false;
                    player.vy = 0;
                }
            }

            // Rolling timer
            if (player.isRolling) {
                player.rollTimer--;
                if (player.rollTimer <= 0) player.isRolling = false;
            }

            // Powerups countdown
            for (let p in activePowerups) {
                activePowerups[p] -= dt;
                if (activePowerups[p] <= 0) delete activePowerups[p];
            }

            // Hoverboard timer
            if (hoverboardActive) {
                hoverboardTimer--;
                if (hoverboardTimer <= 0) hoverboardActive = false;
            }

            // Move Scenery
            sceneryObjects.forEach(obj => obj.z -= currentSpeed);
            sceneryObjects = sceneryObjects.filter(obj => obj.z > -5);

            // Move Track Objects
            trackObjects.forEach(obj => {
                let objSpeed = currentSpeed;
                if (obj.type === 'train' && obj.moving) objSpeed += obj.speed;
                obj.z -= objSpeed;

                // Coin Magnet Effect
                if (obj.type === 'coin' && activePowerups['magnet']) {
                    let dz = obj.z - player.z;
                    if (dz > 0 && dz < 12) {
                        obj.x += (player.x - obj.x) * 0.2;
                        obj.y += (player.y + 0.5 - obj.y) * 0.2;
                    }
                }

                // Collision Check
                let dz = Math.abs(obj.z - player.z);
                let dx = Math.abs(obj.x - player.x);

                if (dz < 0.8 && dx < 0.6) {
                    // Coin Collect
                    if (obj.type === 'coin' && !obj.collected) {
                        obj.collected = true;
                        runCoins += activePowerups['double'] ? 2 : 1;
                        audio.playCoin();
                        createParticles(obj.x, obj.y, obj.z, '#FFD700');
                    }

                    // Powerup Collect
                    if (obj.type === 'powerup' && !obj.collected) {
                        obj.collected = true;
                        activePowerups[obj.powerType] = 300; // ~5 seconds duration
                        audio.playPowerup();
                        createParticles(obj.x, obj.y, obj.z, '#00E5FF');
                    }

                    // Obstacle Collision
                    if (obj.type === 'barrier' || obj.type === 'train') {
                        let hit = false;
                        if (obj.type === 'barrier') {
                            if (obj.high && !player.isRolling) hit = true;
                            if (!obj.high && player.y < 0.6) hit = true;
                        } else if (obj.type === 'train') {
                            if (player.y < 1.8) hit = true;
                        }

                        if (hit) {
                            if (hoverboardActive) {
                                hoverboardActive = false;
                                obj.z = -10; // destroy obstacle
                                createParticles(player.x, player.y + 1, player.z + 1, '#FF0055');
                            } else if (activePowerups['shield']) {
                                delete activePowerups['shield'];
                                obj.z = -10;
                                createParticles(player.x, player.y + 1, player.z + 1, '#00FF87');
                            } else {
                                triggerGameOver();
                            }
                        }
                    }
                }
            });

            trackObjects = trackObjects.filter(obj => obj.z > -5 && !obj.collected);

            // Generate continuous world
            spawnZ -= currentSpeed;
            if (spawnZ < 80) {
                spawnTrackSegment(100);
                spawnZ = 100;
            }

            // Update particles
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.z += p.vz;
                p.life -= 0.05;
            });
            particles = particles.filter(p => p.life > 0);

            updateHUD();
        }

        function createParticles(x, y, z, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x, y: y, z: z,
                    vx: (Math.random() - 0.5) * 0.1,
                    vy: Math.random() * 0.1,
                    vz: (Math.random() - 0.5) * 0.1,
                    color: color,
                    life: 1.0
                });
            }
        }

        /* ==========================================================================
           RENDERING LOGIC (3D-LIKE CANVAS DRAWING)
           ========================================================================== */
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. SKY GRADIENT
            let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.55);
            skyGradient.addColorStop(0, '#1A0B2E');
            skyGradient.addColorStop(0.6, '#6B2D5C');
            skyGradient.addColorStop(1, '#F39C12');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height * 0.55);

            // 2. GROUND & TRACK BASE
            let pFarLeft = project(-6, 0, 80);
            let pFarRight = project(6, 0, 80);
            let pNearLeft = project(-6, 0, 0);
            let pNearRight = project(6, 0, 0);

            ctx.fillStyle = '#3A3A3A';
            ctx.beginPath();
            ctx.moveTo(pNearLeft.x, pNearLeft.y);
            ctx.lineTo(pFarLeft.x, pFarLeft.y);
            ctx.lineTo(pFarRight.x, pFarRight.y);
            ctx.lineTo(pNearRight.x, pNearRight.y);
            ctx.fill();

            // Render Tracks (3 Lanes)
            LANES.forEach(laneX => {
                let r1 = project(laneX - 0.6, 0, 80);
                let r2 = project(laneX + 0.6, 0, 80);
                let r3 = project(laneX + 0.6, 0, 0);
                let r4 = project(laneX - 0.6, 0, 0);

                // Ballast
                ctx.fillStyle = '#555';
                ctx.beginPath();
                ctx.moveTo(r4.x, r4.y); ctx.lineTo(r1.x, r1.y);
                ctx.lineTo(r2.x, r2.y); ctx.lineTo(r3.x, r3.y);
                ctx.fill();

                // Rails
                [-0.4, 0.4].forEach(railOffset => {
                    let railFar = project(laneX + railOffset, 0, 80);
                    let railNear = project(laneX + railOffset, 0, 0);
                    ctx.strokeStyle = '#AAA';
                    ctx.lineWidth = Math.max(1, railNear.scale * 0.05);
                    ctx.beginPath();
                    ctx.moveTo(railNear.x, railNear.y);
                    ctx.lineTo(railFar.x, railFar.y);
                    ctx.stroke();
                });
            });

            // Sleepers (Track Wooden Planks)
            for (let z = 1; z < 80; z += 2) {
                let sp1 = project(-3, 0, z);
                let sp2 = project(3, 0, z);
                ctx.strokeStyle = '#221100';
                ctx.lineWidth = Math.max(1, sp1.scale * 0.08);
                ctx.beginPath();
                ctx.moveTo(sp1.x, sp1.y);
                ctx.lineTo(sp2.x, sp2.y);
                ctx.stroke();
            }

            // 3. SORT & DRAW ALL WORLD OBJECTS (Scenery, Obstacles, Player, Coins)
            let renderQueue = [];

            sceneryObjects.forEach(obj => renderQueue.push({ type: 'scenery', z: obj.z, data: obj }));
            trackObjects.forEach(obj => renderQueue.push({ type: 'track', z: obj.z, data: obj }));
            renderQueue.push({ type: 'player', z: player.z, data: player });

            // Sort Back-to-Front
            renderQueue.sort((a, b) => b.z - a.z);

            renderQueue.forEach(item => {
                if (item.type === 'scenery') drawScenery(item.data);
                if (item.type === 'track') drawTrackObject(item.data);
                if (item.type === 'player') drawPlayer(item.data);
            });

            // Particles
            particles.forEach(p => {
                let proj = project(p.x, p.y, p.z);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, Math.max(1, proj.scale * 0.1), 0, Math.PI * 2);
                ctx.fill();
            });
        }

        /* DRAW HELPERS */
        function drawScenery(obj) {
            let p = project(obj.x, obj.y, obj.z);
            if (obj.type === 'building') {
                let pTop = project(obj.x, obj.y + obj.h, obj.z);
                let w = obj.w * p.scale;
                let h = p.y - pTop.y;
                ctx.fillStyle = obj.color;
                ctx.fillRect(p.x - w / 2, pTop.y, w, h);
                // Windows
                ctx.fillStyle = '#FFD700';
                for (let wy = pTop.y + 10; wy < p.y - 10; wy += 20) {
                    ctx.fillRect(p.x - w / 4, wy, w / 8, 8);
                    ctx.fillRect(p.x + w / 8, wy, w / 8, 8);
                }
            } else if (obj.type === 'tree') {
                ctx.fillStyle = '#5A3D28';
                let trunkW = 0.3 * p.scale;
                let trunkH = 1.5 * p.scale;
                ctx.fillRect(p.x - trunkW / 2, p.y - trunkH, trunkW, trunkH);
                ctx.fillStyle = '#2E7D32';
                ctx.beginPath();
                ctx.arc(p.x, p.y - trunkH, 1.2 * p.scale, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawTrackObject(obj) {
            let p = project(obj.x, obj.y, obj.z);

            if (obj.type === 'coin') {
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(p.x, p.y - (0.3 * p.scale), Math.max(2, 0.35 * p.scale), 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#FFA500';
                ctx.lineWidth = 2;
                ctx.stroke();
            } else if (obj.type === 'barrier') {
                let w = obj.w * p.scale;
                let h = obj.h * p.scale;
                ctx.fillStyle = '#D32F2F';
                ctx.fillRect(p.x - w / 2, p.y - h, w, h);
                // Stripes
                ctx.fillStyle = '#FFF';
                ctx.fillRect(p.x - w / 2, p.y - h, w, h * 0.25);
            } else if (obj.type === 'train') {
                let pTop = project(obj.x, obj.y + obj.h, obj.z);
                let w = obj.w * p.scale;
                let h = p.y - pTop.y;
                ctx.fillStyle = '#1976D2';
                ctx.fillRect(p.x - w / 2, pTop.y, w, h);
                // Train Front windshield & lights
                ctx.fillStyle = '#B0BEC5';
                ctx.fillRect(p.x - w * 0.4, pTop.y + h * 0.1, w * 0.8, h * 0.3);
                ctx.fillStyle = '#FFEB3B';
                ctx.beginPath();
                ctx.arc(p.x - w * 0.3, pTop.y + h * 0.7, 0.1 * p.scale, 0, Math.PI * 2);
                ctx.arc(p.x + w * 0.3, pTop.y + h * 0.7, 0.1 * p.scale, 0, Math.PI * 2);
                ctx.fill();
            } else if (obj.type === 'powerup') {
                ctx.fillStyle = '#00E5FF';
                ctx.beginPath();
                ctx.arc(p.x, p.y - (0.4 * p.scale), 0.4 * p.scale, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawPlayer(pState) {
            let p = project(pState.x, pState.y, pState.z);
            let charData = CHARACTERS[storage.char] || CHARACTERS['kid'];

            let pHeight = (pState.isRolling ? 0.9 : 1.6) * p.scale;
            let pWidth = 0.7 * p.scale;

            // Hoverboard Shadow/Glow
            if (hoverboardActive) {
                ctx.fillStyle = 'rgba(255, 0, 127, 0.5)';
                ctx.beginPath();
                ctx.ellipse(p.x, p.y, pWidth, pWidth * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Body (Hoodie / Jacket)
            ctx.fillStyle = charData.color;
            ctx.fillRect(p.x - pWidth / 2, p.y - pHeight, pWidth, pHeight * 0.6);

            // Head & Cap
            ctx.fillStyle = '#FFCC80'; // Skin
            ctx.beginPath();
            ctx.arc(p.x, p.y - pHeight * 0.8, pWidth * 0.35, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = charData.cap; // Cap
            ctx.fillRect(p.x - pWidth * 0.4, p.y - pHeight * 0.95, pWidth * 0.8, pHeight * 0.2);

            // Legs / Pants
            ctx.fillStyle = '#1A237E';
            ctx.fillRect(p.x - pWidth * 0.4, p.y - pHeight * 0.4, pWidth * 0.35, pHeight * 0.4);
            ctx.fillRect(p.x + pWidth * 0.05, p.y - pHeight * 0.4, pWidth * 0.35, pHeight * 0.4);
        }

        /* ==========================================================================
           UI & MENU CONTROLLER
           ========================================================================== */
        function hideAllOverlays() {
            const ids = ['menu-overlay', 'hud-overlay', 'pause-overlay', 'gameover-overlay', 'shop-overlay', 'missions-overlay', 'settings-overlay'];
            ids.forEach(id => document.getElementById(id).classList.add('hidden'));
        }

        function showOverlay(id) {
            hideAllOverlays();
            document.getElementById(id).classList.remove('hidden');
        }

        function updateHUD() {
            document.getElementById('hud-coins').innerText = runCoins;
            document.getElementById('hud-score').innerText = Math.floor(score);
            document.getElementById('hud-daily').innerText = storage.dailyScore;
            document.getElementById('hud-mult').innerText = activePowerups['double'] ? '2' : '1';

            // Powerups List HUD
            let container = document.getElementById('powerup-list');
            container.innerHTML = '';
            for (let key in activePowerups) {
                let div = document.createElement('div');
                div.className = 'powerup-item';
                let pct = (activePowerups[key] / 300) * 100;
                div.innerHTML = `<div>${key.toUpperCase()}</div><div class="powerup-bar" style="width:${pct}%"></div>`;
                container.appendChild(div);
            }

            // Hoverboard button toggle
            const boardBtn = document.getElementById('btn-board');
            if (hoverboardActive) boardBtn.classList.add('hidden');
            else boardBtn.classList.remove('hidden');
        }

        function pauseGame() {
            if (state === 'PLAYING') {
                state = 'PAUSED';
                document.getElementById('pause-overlay').classList.remove('hidden');
            }
        }

        function resumeGame() {
            if (state === 'PAUSED') {
                state = 'PLAYING';
                document.getElementById('pause-overlay').classList.add('hidden');
            }
        }

        // Event Attachments
        document.getElementById('btn-play').onclick = () => startGame();
        document.getElementById('btn-playagain').onclick = () => startGame();
        document.getElementById('btn-restart-pause').onclick = () => startGame();

        document.getElementById('btn-pause').onclick = () => pauseGame();
        document.getElementById('btn-resume').onclick = () => resumeGame();
        document.getElementById('btn-quit').onclick = () => {
            state = 'MENU';
            updateMenuUI();
            showOverlay('menu-overlay');
        };
        document.getElementById('btn-home').onclick = () => {
            state = 'MENU';
            updateMenuUI();
            showOverlay('menu-overlay');
        };

        document.getElementById('btn-board').onclick = () => activateHoverboard();

        // Shop UI Render
        function renderShop() {
            document.getElementById('shop-coins').innerText = storage.coins;
            let list = document.getElementById('shop-list');
            list.innerHTML = '';
            for (let key in CHARACTERS) {
                let item = CHARACTERS[key];
                let isUnlocked = storage.unlockedChars.includes(key);
                let isSelected = storage.char === key;

                let div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <div>
                        <div class="list-item-title">${item.name}</div>
                        <div class="list-item-desc">${isUnlocked ? 'Unlocked' : 'Cost: ' + item.price + ' Coins'}</div>
                    </div>
                    <button class="btn btn-small ${isSelected ? 'btn-green' : 'btn-blue'}">${isSelected ? 'EQUIPPED' : (isUnlocked ? 'SELECT' : 'BUY')}</button>
                `;
                div.querySelector('button').onclick = () => {
                    audio.playClick();
                    if (isUnlocked) {
                        storage.char = key;
                    } else if (storage.coins >= item.price) {
                        storage.coins -= item.price;
                        storage.unlockedChars.push(key);
                        storage.char = key;
                    }
                    saveStorage();
                    renderShop();
                };
                list.appendChild(div);
            }
        }

        document.getElementById('btn-shop').onclick = () => { audio.playClick(); renderShop(); showOverlay('shop-overlay'); };
        document.getElementById('btn-shop-go').onclick = () => { audio.playClick(); renderShop(); showOverlay('shop-overlay'); };
        document.getElementById('btn-shop-close').onclick = () => {
            audio.playClick();
            if (state === 'GAMEOVER') showOverlay('gameover-overlay');
            else showOverlay('menu-overlay');
        };

        // Missions UI Render
        function renderMissions() {
            let list = document.getElementById('missions-list');
            list.innerHTML = '';
            missions.forEach(m => {
                let div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <div>
                        <div class="list-item-title">${m.desc}</div>
                        <div class="list-item-desc">Progress: ${m.current}/${m.target} | Reward: 🪙${m.reward}</div>
                    </div>
                    <button class="btn btn-small ${m.done ? 'btn-green' : ''}" ${m.done ? 'disabled' : ''}>${m.done ? 'DONE' : 'IN PROGRESS'}</button>
                `;
                list.appendChild(div);
            });
        }
        document.getElementById('btn-missions').onclick = () => { audio.playClick(); renderMissions(); showOverlay('missions-overlay'); };
        document.getElementById('btn-missions-close').onclick = () => { audio.playClick(); showOverlay('menu-overlay'); };

        // Settings UI Render
        document.getElementById('btn-settings').onclick = () => { audio.playClick(); showOverlay('settings-overlay'); };
        document.getElementById('btn-settings-close').onclick = () => { audio.playClick(); showOverlay('menu-overlay'); };

        const toggleSoundBtn = document.getElementById('btn-toggle-sound');
        toggleSoundBtn.onclick = () => {
            audio.enabled = !audio.enabled;
            toggleSoundBtn.innerText = audio.enabled ? 'ON' : 'OFF';
        };

        const toggleTouchBtn = document.getElementById('btn-toggle-touch');
        toggleTouchBtn.onclick = () => {
            storage.touchEnabled = !storage.touchEnabled;
            saveStorage();
            toggleTouchBtn.innerText = storage.touchEnabled ? 'ON' : 'OFF';
            if (storage.touchEnabled) document.getElementById('touch-controls').classList.remove('hidden');
            else document.getElementById('touch-controls').classList.add('hidden');
        };

        // Touch Control Buttons
        document.getElementById('t-left').onclick = () => moveLeft();
        document.getElementById('t-right').onclick = () => moveRight();
        document.getElementById('t-up').onclick = () => jump();
        document.getElementById('t-down').onclick = () => roll();

        function updateMenuUI() {
            document.getElementById('menu-coins').innerText = storage.coins;
            document.getElementById('menu-highscore').innerText = storage.highScore;
        }

        /* ==========================================================================
           MAIN GAME LOOP
           ========================================================================== */
        function gameLoop(now) {
            let dt = (now - lastTime) / 1000;
            lastTime = now;

            if (state === 'PLAYING') {
                update(dt);
            }
            
            render();
            requestAnimationFrame(gameLoop);
        }

        // Init
        updateMenuUI();
        requestAnimationFrame(gameLoop);

    </script>
</body>
</html>
