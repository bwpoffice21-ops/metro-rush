<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>METRO RUSH — Endless Runner</title>

<style>
/* =========================================================
   METRO RUSH
   PREMIUM SINGLE-FILE HTML5 GAME
   ========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --cyan: #00eaff;
    --blue: #4267ff;
    --purple: #8b5cf6;
    --pink: #ff3cac;
    --green: #39ff88;
    --yellow: #ffd84d;
    --danger: #ff4d67;
    --white: #ffffff;
    --glass: rgba(255,255,255,.09);
    --glass-border: rgba(255,255,255,.15);
    --dark: #050713;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050713;
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    color: white;
}

body {
    touch-action: none;
}

button {
    font: inherit;
}

/* =========================================================
   GAME ROOT
   ========================================================= */

#app {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 0%, #17204b 0%, #080b1b 45%, #03040a 100%);
}

#gameCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

/* =========================================================
   TOP AMBIENT GLOW
   ========================================================= */

.ambient {
    position: absolute;
    pointer-events: none;
    border-radius: 50%;
    filter: blur(70px);
    opacity: .25;
}

.ambient.one {
    width: 35vw;
    height: 35vw;
    background: #365cff;
    top: -15vw;
    left: -8vw;
}

.ambient.two {
    width: 30vw;
    height: 30vw;
    background: #ff25c8;
    top: 15%;
    right: -15vw;
}

.ambient.three {
    width: 25vw;
    height: 25vw;
    background: #00eaff;
    bottom: -12vw;
    left: 30%;
}

/* =========================================================
   HOME SCREEN
   ========================================================= */

.screen {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
    transition:
        opacity .45s ease,
        visibility .45s ease,
        transform .45s ease;
    z-index: 20;
}

.screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: scale(1.04);
}

.home-content {
    width: min(620px, 94vw);
    text-align: center;
    position: relative;
}

.logo-wrap {
    margin-bottom: 32px;
}

.logo-small {
    font-size: 11px;
    letter-spacing: 6px;
    font-weight: 800;
    color: rgba(255,255,255,.55);
    margin-bottom: 10px;
}

.logo {
    font-size: clamp(55px, 10vw, 110px);
    line-height: .88;
    font-weight: 1000;
    letter-spacing: -6px;
    font-style: italic;
    text-transform: uppercase;
    background:
        linear-gradient(
            135deg,
            #ffffff 5%,
            #7cefff 35%,
            #4267ff 60%,
            #ff3cac 90%
        );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter:
        drop-shadow(0 0 10px rgba(0,234,255,.2))
        drop-shadow(0 0 35px rgba(66,103,255,.2));
}

.tagline {
    margin-top: 15px;
    font-size: 13px;
    letter-spacing: 5px;
    color: rgba(255,255,255,.55);
    font-weight: 700;
}

/* =========================================================
   GLASS CARD
   ========================================================= */

.glass-card {
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.035)
        );
    border: 1px solid var(--glass-border);
    box-shadow:
        0 30px 80px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-radius: 28px;
}

/* =========================================================
   PLAY BUTTON
   ========================================================= */

.play-button {
    position: relative;
    width: min(330px, 80vw);
    height: 76px;
    margin: 35px auto 25px;
    border: 0;
    border-radius: 22px;
    color: #03040b;
    font-size: 20px;
    font-weight: 1000;
    letter-spacing: 3px;
    cursor: pointer;
    overflow: hidden;
    background:
        linear-gradient(
            110deg,
            #ffffff 0%,
            #7cefff 35%,
            #6d7cff 68%,
            #ff62c9 100%
        );
    box-shadow:
        0 12px 35px rgba(0,234,255,.2),
        0 0 0 1px rgba(255,255,255,.2) inset;
    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.play-button::before {
    content: "";
    position: absolute;
    inset: -100% 30%;
    background: rgba(255,255,255,.55);
    transform: rotate(25deg);
    animation: buttonShine 3s infinite;
}

.play-button span {
    position: relative;
    z-index: 2;
}

.play-button:hover {
    transform: translateY(-4px) scale(1.015);
    box-shadow:
        0 18px 45px rgba(0,234,255,.3),
        0 0 35px rgba(255,60,172,.15);
}

.play-button:active {
    transform: scale(.97);
}

@keyframes buttonShine {
    0% { transform: translateX(-180%) rotate(25deg); }
    40%,100% { transform: translateX(250%) rotate(25deg); }
}

/* =========================================================
   HOME INFO
   ========================================================= */

.home-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: min(500px, 90vw);
    margin: auto;
}

.stat-box {
    padding: 17px 10px;
    border-radius: 18px;
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.08);
}

.stat-label {
    font-size: 9px;
    letter-spacing: 2px;
    color: rgba(255,255,255,.4);
    font-weight: 800;
}

.stat-value {
    margin-top: 6px;
    font-size: 19px;
    font-weight: 900;
}

.controls-tip {
    margin-top: 24px;
    color: rgba(255,255,255,.5);
    font-size: 12px;
    line-height: 1.8;
}

.controls-tip b {
    color: rgba(255,255,255,.85);
}

/* =========================================================
   HUD
   ========================================================= */

#hud {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    transition: opacity .35s ease;
}

#hud.visible {
    opacity: 1;
}

.hud-top {
    position: absolute;
    top: 20px;
    left: 20px;
    right: 20px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
}

.hud-group {
    display: flex;
    gap: 10px;
}

.hud-card {
    min-width: 105px;
    padding: 12px 16px;
    border-radius: 17px;
    background: rgba(5,7,19,.55);
    border: 1px solid rgba(255,255,255,.11);
    backdrop-filter: blur(18px);
    box-shadow: 0 10px 30px rgba(0,0,0,.2);
}

.hud-label {
    display: block;
    font-size: 8px;
    color: rgba(255,255,255,.45);
    letter-spacing: 2px;
    font-weight: 900;
}

.hud-value {
    display: block;
    margin-top: 3px;
    font-size: 19px;
    font-weight: 950;
}

.coin-value {
    color: var(--yellow);
}

.score-value {
    color: #fff;
}

.pause-btn {
    pointer-events: auto;
    width: 48px;
    height: 48px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(5,7,19,.6);
    color: white;
    cursor: pointer;
    font-size: 18px;
    backdrop-filter: blur(15px);
}

.pause-btn:active {
    transform: scale(.92);
}

/* =========================================================
   SPEED BAR
   ========================================================= */

.speed-container {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 95px;
    width: min(260px, 45vw);
    height: 5px;
    border-radius: 10px;
    background: rgba(255,255,255,.1);
    overflow: hidden;
}

.speed-bar {
    width: 15%;
    height: 100%;
    border-radius: inherit;
    background:
        linear-gradient(90deg, #00eaff, #4267ff, #ff3cac);
    box-shadow: 0 0 15px rgba(0,234,255,.6);
    transition: width .3s ease;
}

/* =========================================================
   PAUSE / GAME OVER
   ========================================================= */

.overlay {
    position: absolute;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(2,3,10,.45);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: .35s ease;
}

.overlay.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

.overlay-card {
    width: min(470px, 92vw);
    padding: 42px 30px;
    text-align: center;
    border-radius: 30px;
    background:
        linear-gradient(
            145deg,
            rgba(19,24,55,.88),
            rgba(5,7,19,.92)
        );
    border: 1px solid rgba(255,255,255,.14);
    box-shadow:
        0 40px 100px rgba(0,0,0,.6),
        inset 0 1px 0 rgba(255,255,255,.08);
}

.overlay-kicker {
    font-size: 10px;
    letter-spacing: 4px;
    color: rgba(255,255,255,.4);
    font-weight: 900;
}

.overlay-title {
    margin: 10px 0 28px;
    font-size: clamp(40px, 9vw, 68px);
    font-weight: 1000;
    font-style: italic;
    letter-spacing: -3px;
}

.game-over-title {
    background: linear-gradient(90deg, #ff5474, #ff3cac);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.pause-title {
    background: linear-gradient(90deg, #7cefff, #6d7cff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.result-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 10px;
    margin-bottom: 25px;
}

.result-box {
    padding: 15px;
    border-radius: 18px;
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.07);
}

.result-label {
    font-size: 8px;
    letter-spacing: 2px;
    color: rgba(255,255,255,.4);
    font-weight: 900;
}

.result-number {
    margin-top: 6px;
    font-size: 24px;
    font-weight: 950;
}

.overlay-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
}

.action-button {
    flex: 1;
    max-width: 190px;
    height: 55px;
    border: 0;
    border-radius: 17px;
    font-size: 12px;
    font-weight: 950;
    letter-spacing: 1.5px;
    cursor: pointer;
    color: white;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
}

.action-button.primary {
    background: linear-gradient(110deg, #00d9ff, #5265ff);
    color: #03040b;
    border: 0;
    box-shadow: 0 10px 30px rgba(66,103,255,.25);
}

.action-button:hover {
    transform: translateY(-2px);
}

.action-button:active {
    transform: scale(.96);
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .screen {
        padding: 15px;
    }

    .logo {
        letter-spacing: -4px;
    }

    .tagline {
        font-size: 9px;
        letter-spacing: 3px;
    }

    .play-button {
        height: 68px;
        margin-top: 28px;
    }

    .home-stats {
        gap: 7px;
    }

    .stat-box {
        padding: 13px 5px;
    }

    .stat-value {
        font-size: 16px;
    }

    .controls-tip {
        font-size: 10px;
    }

    .hud-top {
        top: 12px;
        left: 12px;
        right: 12px;
    }

    .hud-card {
        min-width: 75px;
        padding: 9px 10px;
    }

    .hud-value {
        font-size: 15px;
    }

    .hud-label {
        font-size: 7px;
    }

    .pause-btn {
        width: 42px;
        height: 42px;
    }

    .speed-container {
        top: 75px;
    }

    .overlay-card {
        padding: 35px 20px;
    }
}

/* =========================================================
   SMALL DEVICES
   ========================================================= */

@media (max-height: 650px) {

    .logo-wrap {
        margin-bottom: 15px;
    }

    .logo {
        font-size: 58px;
    }

    .play-button {
        margin: 20px auto 15px;
        height: 60px;
    }

    .controls-tip {
        margin-top: 12px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div class="ambient one"></div>
    <div class="ambient two"></div>
    <div class="ambient three"></div>

    <canvas id="gameCanvas"></canvas>

    <!-- =====================================================
         HOME
         ===================================================== -->

    <section id="homeScreen" class="screen">

        <div class="home-content">

            <div class="logo-wrap">

                <div class="logo-small">
                    ORIGINAL ENDLESS RUNNER
                </div>

                <div class="logo">
                    METRO<br>RUSH
                </div>

                <div class="tagline">
                    RUN • DODGE • COLLECT
                </div>

            </div>

            <button id="playButton" class="play-button">
                <span>▶ &nbsp; PLAY NOW</span>
            </button>

            <div class="home-stats">

                <div class="stat-box">
                    <div class="stat-label">
                        BEST SCORE
                    </div>
                    <div id="homeBest" class="stat-value">
                        0
                    </div>
                </div>

                <div class="stat-box">
                    <div class="stat-label">
                        BEST COINS
                    </div>
                    <div id="homeCoins" class="stat-value">
                        0
                    </div>
                </div>

                <div class="stat-box">
                    <div class="stat-label">
                        STATUS
                    </div>
                    <div class="stat-value">
                        READY
                    </div>
                </div>

            </div>

            <div class="controls-tip">
                <b>DESKTOP</b> &nbsp; ← → MOVE &nbsp; • &nbsp; ↑ / SPACE JUMP
                <br>
                <b>MOBILE</b> &nbsp; SWIPE LEFT / RIGHT / UP
            </div>

        </div>

    </section>

    <!-- =====================================================
         HUD
         ===================================================== -->

    <div id="hud">

        <div class="hud-top">

            <div class="hud-group">

                <div class="hud-card">
                    <span class="hud-label">SCORE</span>
                    <span id="scoreDisplay" class="hud-value score-value">
                        0
                    </span>
                </div>

                <div class="hud-card">
                    <span class="hud-label">COINS</span>
                    <span id="coinDisplay" class="hud-value coin-value">
                        0
                    </span>
                </div>

                <div class="hud-card">
                    <span class="hud-label">DISTANCE</span>
                    <span id="distanceDisplay" class="hud-value">
                        0m
                    </span>
                </div>

            </div>

            <button id="pauseButton" class="pause-btn">
                ❚❚
            </button>

        </div>

        <div class="speed-container">
            <div id="speedBar" class="speed-bar"></div>
        </div>

    </div>

    <!-- =====================================================
         PAUSE
         ===================================================== -->

    <div id="pauseOverlay" class="overlay">

        <div class="overlay-card">

            <div class="overlay-kicker">
                RUN TEMPORARILY STOPPED
            </div>

            <div class="overlay-title pause-title">
                PAUSED
            </div>

            <div class="overlay-actions">

                <button id="resumeButton"
                        class="action-button primary">
                    RESUME
                </button>

                <button id="pauseRestartButton"
                        class="action-button">
                    RESTART
                </button>

            </div>

        </div>

    </div>

    <!-- =====================================================
         GAME OVER
         ===================================================== -->

    <div id="gameOverOverlay" class="overlay">

        <div class="overlay-card">

            <div class="overlay-kicker">
                YOUR RUN HAS ENDED
            </div>

            <div class="overlay-title game-over-title">
                GAME OVER
            </div>

            <div class="result-grid">

                <div class="result-box">
                    <div class="result-label">SCORE</div>
                    <div id="finalScore" class="result-number">
                        0
                    </div>
                </div>

                <div class="result-box">
                    <div class="result-label">COINS</div>
                    <div id="finalCoins" class="result-number">
                        0
                    </div>
                </div>

                <div class="result-box">
                    <div class="result-label">DISTANCE</div>
                    <div id="finalDistance" class="result-number">
                        0m
                    </div>
                </div>

                <div class="result-box">
                    <div class="result-label">BEST</div>
                    <div id="finalBest" class="result-number">
                        0
                    </div>
                </div>

            </div>

            <div class="overlay-actions">

                <button id="restartButton"
                        class="action-button primary">
                    ↻ &nbsp; RUN AGAIN
                </button>

                <button id="homeButton"
                        class="action-button">
                    HOME
                </button>

            </div>

        </div>

    </div>

</div>

<script>
/* =========================================================
   METRO RUSH
   GAME ENGINE
   ========================================================= */

"use strict";

/* =========================================================
   CANVAS
   ========================================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;

function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* =========================================================
   DOM
   ========================================================= */

const homeScreen = document.getElementById("homeScreen");
const hud = document.getElementById("hud");

const playButton = document.getElementById("playButton");
const pauseButton = document.getElementById("pauseButton");

const pauseOverlay = document.getElementById("pauseOverlay");
const gameOverOverlay = document.getElementById("gameOverOverlay");

const resumeButton = document.getElementById("resumeButton");
const pauseRestartButton =
    document.getElementById("pauseRestartButton");

const restartButton = document.getElementById("restartButton");
const homeButton = document.getElementById("homeButton");

const scoreDisplay =
    document.getElementById("scoreDisplay");

const coinDisplay =
    document.getElementById("coinDisplay");

const distanceDisplay =
    document.getElementById("distanceDisplay");

const speedBar =
    document.getElementById("speedBar");

const homeBest =
    document.getElementById("homeBest");

const homeCoins =
    document.getElementById("homeCoins");

const finalScore =
    document.getElementById("finalScore");

const finalCoins =
    document.getElementById("finalCoins");

const finalDistance =
    document.getElementById("finalDistance");

const finalBest =
    document.getElementById("finalBest");

/* =========================================================
   STORAGE
   ========================================================= */

const storage = {

    get(key, fallback = 0) {
        try {
            const value = localStorage.getItem(key);
            return value === null ? fallback : Number(value);
        } catch {
            return fallback;
        }
    },

    set(key, value) {
        try {
            localStorage.setItem(key, String(value));
        } catch {}
    }
};

let bestScore = storage.get("metroRushBest", 0);
let bestCoins = storage.get("metroRushCoins", 0);

homeBest.textContent = bestScore.toLocaleString();
homeCoins.textContent = bestCoins.toLocaleString();

/* =========================================================
   GAME STATE
   ========================================================= */

const STATE = {
    HOME: "HOME",
    PLAYING: "PLAYING",
    PAUSED: "PAUSED",
    GAMEOVER: "GAMEOVER"
};

let gameState = STATE.HOME;

let score = 0;
let coins = 0;
let distance = 0;

let gameSpeed = 0.42;
let difficulty = 0;

let lastTime = 0;
let animationFrame = 0;

let spawnTimer = 0;
let coinTimer = 0;

let shake = 0;

/* =========================================================
   PLAYER
   ========================================================= */

const player = {

    lane: 1,
    targetLane: 1,

    x: 0,
    y: 0,

    width: 48,
    height: 80,

    jumpY: 0,
    velocityY: 0,

    jumping: false,

    runTime: 0,

    reset() {
        this.lane = 1;
        this.targetLane = 1;
        this.x = laneX(1);
        this.y = H * .78;

        this.jumpY = 0;
        this.velocityY = 0;
        this.jumping = false;
        this.runTime = 0;
    },

    moveLeft() {
        if (gameState !== STATE.PLAYING) return;

        if (this.targetLane > 0) {
            this.targetLane--;
            playTone(280, .045);
        }
    },

    moveRight() {
        if (gameState !== STATE.PLAYING) return;

        if (this.targetLane < 2) {
            this.targetLane++;
            playTone(320, .045);
        }
    },

    jump() {
        if (gameState !== STATE.PLAYING) return;

        if (!this.jumping) {

            this.jumping = true;
            this.velocityY = 0.92;

            playTone(540, .09);
        }
    },

    update(dt) {

        const target = laneX(this.targetLane);

        this.x +=
            (target - this.x) *
            Math.min(1, dt * 12);

        if (this.jumping) {

            this.jumpY += this.velocityY * dt * 60;

            this.velocityY -= 0.052 * dt * 60;

            if (this.jumpY <= 0) {

                this.jumpY = 0;
                this.velocityY = 0;
                this.jumping = false;

                createDust(
                    this.x,
                    this.y + 4,
                    7
                );

                playTone(190, .035);
            }
        }

        this.runTime += dt * 10;
    },

    draw() {

        const x = this.x;
        const y = this.y - this.jumpY;

        const bob =
            Math.sin(this.runTime) * 2;

        const leg =
            Math.sin(this.runTime * 1.8) * 7;

        ctx.save();

        /* Shadow */

        ctx.globalAlpha =
            Math.max(.1, 0.35 - this.jumpY / 400);

        ctx.beginPath();

        ctx.ellipse(
            x,
            this.y + 7,
            31 - this.jumpY * .03,
            8,
            0,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#000";
        ctx.fill();

        ctx.globalAlpha = 1;

        /* Backpack */

        ctx.fillStyle = "#6d4cff";

        roundRect(
            x - 22,
            y - 42 + bob,
            13,
            31,
            6
        );

        ctx.fill();

        /* Legs */

        ctx.strokeStyle = "#151b38";
        ctx.lineWidth = 10;
        ctx.lineCap = "round";

        ctx.beginPath();

        ctx.moveTo(x - 8, y + 22);
        ctx.lineTo(
            x - 12 + leg,
            y + 46
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(x + 8, y + 22);
        ctx.lineTo(
            x + 13 - leg,
            y + 46
        );

        ctx.stroke();

        /* Shoes */

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 6;

        ctx.beginPath();

        ctx.moveTo(
            x - 12 + leg,
            y + 46
        );

        ctx.lineTo(
            x - 24 + leg,
            y + 46
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(
            x + 13 - leg,
            y + 46
        );

        ctx.lineTo(
            x + 25 - leg,
            y + 46
        );

        ctx.stroke();

        /* Body */

        const bodyGradient =
            ctx.createLinearGradient(
                x - 18,
                y - 30,
                x + 18,
                y + 25
            );

        bodyGradient.addColorStop(
            0,
            "#00eaff"
        );

        bodyGradient.addColorStop(
            1,
            "#5364ff"
        );

        ctx.fillStyle = bodyGradient;

        roundRect(
            x - 18,
            y - 25 + bob,
            36,
            50,
            12
        );

        ctx.fill();

        /* Arms */

        ctx.strokeStyle = "#f3b38e";
        ctx.lineWidth = 9;

        ctx.beginPath();

        ctx.moveTo(x - 15, y - 12);
        ctx.lineTo(
            x - 28,
            y + 10 + leg
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(x + 15, y - 12);
        ctx.lineTo(
            x + 28,
            y + 10 - leg
        );

        ctx.stroke();

        /* Head */

        ctx.fillStyle = "#f2b58f";

        ctx.beginPath();

        ctx.arc(
            x,
            y - 45 + bob,
            16,
            0,
            Math.PI * 2
        );

        ctx.fill();

        /* Hair */

        ctx.fillStyle = "#10162e";

        ctx.beginPath();

        ctx.arc(
            x,
            y - 51 + bob,
            16,
            Math.PI,
            Math.PI * 2
        );

        ctx.fill();

        /* Headband */

        ctx.strokeStyle = "#ff3cac";
        ctx.lineWidth = 4;

        ctx.beginPath();

        ctx.arc(
            x,
            y - 48 + bob,
            16,
            Math.PI * 1.05,
            Math.PI * 1.9
        );

        ctx.stroke();

        /* Glow */

        ctx.globalAlpha = .12;

        ctx.fillStyle = "#00eaff";

        ctx.beginPath();

        ctx.arc(
            x,
            y - 5,
            42,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }
};

/* =========================================================
   WORLD OBJECTS
   ========================================================= */

let obstacles = [];
let coinObjects = [];
let particles = [];

/* =========================================================
   LANE / PERSPECTIVE
   ========================================================= */

function laneX(lane, depth = 0) {

    const horizon = H * .39;
    const bottom = H * .88;

    const perspective =
        Math.pow(
            Math.max(0, Math.min(1, depth)),
            0.8
        );

    const roadWidth =
        65 +
        (Math.min(W * .78, 700) - 65) *
        perspective;

    const center = W / 2;

    const spacing =
        roadWidth / 3;

    return center +
        (lane - 1) * spacing;
}

function depthY(depth) {

    const horizon = H * .39;
    const bottom = H * .86;

    return horizon +
        (bottom - horizon) *
        Math.pow(
            Math.max(0, Math.min(1, depth)),
            .88
        );
}

/* =========================================================
   OBSTACLE
   ========================================================= */

class Obstacle {

    constructor(lane, type = "barrier") {

        this.lane = lane;
        this.depth = 0;
        this.type = type;

        this.dead = false;

        this.spin = Math.random() * Math.PI;
    }

    update(dt) {

        this.depth +=
            gameSpeed *
            dt *
            .72;

        this.spin += dt * 2;

        if (this.depth > 1.12) {
            this.dead = true;
        }
    }

    draw() {

        if (this.depth < .02) return;

        const x = laneX(
            this.lane,
            this.depth
        );

        const y = depthY(this.depth);

        const scale =
            .22 +
            this.depth * 1.12;

        const w =
            28 * scale;

        const h =
            38 * scale;

        ctx.save();

        ctx.translate(x, y);

        if (this.type === "barrier") {

            ctx.fillStyle = "#ff405f";

            roundRect(
                -w,
                -h,
                w * 2,
                h,
                7
            );

            ctx.fill();

            ctx.fillStyle = "#ffffff";

            for (let i = -1; i <= 1; i++) {

                ctx.save();

                ctx.translate(
                    i * w * .65,
                    -h / 2
                );

                ctx.rotate(-.45);

                ctx.fillRect(
                    -4 * scale,
                    -h * .45,
                    8 * scale,
                    h * .9
                );

                ctx.restore();
            }

        } else if (this.type === "crate") {

            const gradient =
                ctx.createLinearGradient(
                    -w,
                    -h,
                    w,
                    0
                );

            gradient.addColorStop(
                0,
                "#7c4dff"
            );

            gradient.addColorStop(
                1,
                "#00bcd4"
            );

            ctx.fillStyle = gradient;

            roundRect(
                -w,
                -h,
                w * 2,
                h * 1.4,
                7
            );

            ctx.fill();

            ctx.strokeStyle =
                "rgba(255,255,255,.35)";

            ctx.lineWidth = 2;

            ctx.stroke();

        } else {

            ctx.fillStyle = "#ffc928";

            ctx.beginPath();

            ctx.moveTo(0, -h);
            ctx.lineTo(w, h);
            ctx.lineTo(-w, h);
            ctx.closePath();

            ctx.fill();

            ctx.fillStyle = "#ff3c61";

            ctx.fillRect(
                -w * .55,
                -h * .15,
                w * 1.1,
                h * .18
            );
        }

        ctx.restore();
    }
}

/* =========================================================
   COIN
   ========================================================= */

class Coin {

    constructor(lane, depth) {

        this.lane = lane;
        this.depth = depth;
        this.dead = false;

        this.spin =
            Math.random() *
            Math.PI * 2;
    }

    update(dt) {

        this.depth +=
            gameSpeed *
            dt *
            .78;

        this.spin +=
            dt * 7;

        if (this.depth > 1.12) {
            this.dead = true;
        }

        this.checkCollection();
    }

    checkCollection() {

        if (this.depth < .87 ||
            this.depth > 1.05) return;

        const px =
            player.x;

        const cx =
            laneX(
                this.lane,
                this.depth
            );

        const py =
            player.y -
            player.jumpY;

        const cy =
            depthY(this.depth);

        const distanceX =
            Math.abs(px - cx);

        const distanceY =
            Math.abs(py - cy);

        if (
            distanceX < 34 &&
            distanceY < 70
        ) {

            this.dead = true;
            coins++;
            score += 25;

            createCoinBurst(
                cx,
                cy
            );

            playTone(
                850 + Math.random() * 180,
                .055
            );
        }
    }

    draw() {

        if (this.depth < .03) return;

        const x =
            laneX(
                this.lane,
                this.depth
            );

        const y =
            depthY(this.depth) -
            10 * this.depth;

        const scale =
            .12 +
            this.depth * .95;

        const radius =
            10 * scale;

        const width =
            Math.max(
                2,
                Math.abs(
                    Math.cos(this.spin)
                ) * radius
            );

        ctx.save();

        ctx.translate(x, y);

        ctx.shadowColor = "#ffd84d";
        ctx.shadowBlur = 18 * scale;

        ctx.fillStyle = "#ffd84d";

        ctx.beginPath();

        ctx.ellipse(
            0,
            0,
            width,
            radius,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur = 0;

        ctx.strokeStyle = "#fff3a0";
        ctx.lineWidth = 2 * scale;

        ctx.stroke();

        ctx.restore();
    }
}

/* =========================================================
   PARTICLES
   ========================================================= */

function createCoinBurst(x, y) {

    for (let i = 0; i < 12; i++) {

        particles.push({

            x,
            y,

            vx:
                (Math.random() - .5) *
                4,

            vy:
                (Math.random() - .5) *
                4,

            life: 1,

            size:
                2 +
                Math.random() * 4,

            type: "coin"
        });
    }
}

function createDust(x, y, amount = 5) {

    for (let i = 0; i < amount; i++) {

        particles.push({

            x:
                x +
                (Math.random() - .5) *
                30,

            y,

            vx:
                (Math.random() - .5) *
                3,

            vy:
                -Math.random() *
                2,

            life: .6,

            size:
                2 +
                Math.random() * 4,

            type: "dust"
        });
    }
}

function createCrashParticles(x, y) {

    for (let i = 0; i < 35; i++) {

        particles.push({

            x,
            y,

            vx:
                (Math.random() - .5) *
                9,

            vy:
                (Math.random() - .5) *
                9,

            life: .8 +
                Math.random() * .6,

            size:
                2 +
                Math.random() * 6,

            type: "crash"
        });
    }
}

function updateParticles(dt) {

    for (const p of particles) {

        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;

        p.vy +=
            .08 * dt * 60;

        p.life -=
            dt * 1.5;
    }

    particles =
        particles.filter(
            p => p.life > 0
        );
}

function drawParticles() {

    for (const p of particles) {

        ctx.save();

        ctx.globalAlpha =
            Math.max(0, p.life);

        if (p.type === "coin") {
            ctx.fillStyle = "#ffd84d";
        } else if (p.type === "crash") {
            ctx.fillStyle = "#ff3c70";
        } else {
            ctx.fillStyle = "#b7c3d8";
        }

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }
}

generateBuildings();

function drawSky() {

    const sky =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    sky.addColorStop(
        0,
        "#07091a"
    );

    sky.addColorStop(

    );

        "#050712"
    );

    ctx.fillStyle = sky;

    ctx.fillRect(

        0,
        W,
        H
    );

    /* Moon */

    const moonX =
        W * .78;

    const moonY =
        H * .18;

    const moonGlow =
        ctx.createRadialGradient(
            moonX,
            moonY,
            2,

            100
        );

    moonGlow.addColorStop(

    );

    );

    );

    ctx.arc(
        moonX,
        moonY,

        0,
        Math.PI * 2
    );

    for (let i = 0; i < 55; i++) {

        const sx =
            ((i * 97) % 1000) /
            1000 *
            W;

        const sy =
            ((i * 43) % 1000) /
            1000 *
            H *
            .42;

        const alpha =
            .2 +
            Math.sin(
                performance.now() / 700 +
                i
            ) *
            .1;

        ctx.fillStyle =
            `rgba(255,255,255,${alpha})`;

        ctx.fillRect(

            sy,

        );

}

function drawCity() {

    const horizon =
        H * .39;

    for (const b of buildings) {

        const sideX =
            b.side < 0
                ? W * .5 -
                  b.width -
                  b.x % (W * .25)
                : W * .5 +
                  b.x % (W * .25);

        const y =
            horizon +
            8;

        ctx.fillStyle =
            b.color;

        ctx.fillRect(
            sideX,
            y - b.height,
            b.width,
            b.height
        );

        /* Windows */

        const rows =
            Math.floor(
                b.height / 17
            );

        const cols =
            Math.max(
                1,
                Math.floor(
                    b.width / 15
                )
            );

        for (let r = 0; r < rows; r++) {

            for (let c = 0; c < cols; c++) {

                if (
                    (r * 7 +
                    c * 3 +
                    Math.floor(
                        performance.now() /
                        3000
                    )) % 5 === 0
                ) {

                    ctx.fillStyle =
                        "rgba(80,210,255,.18)";

                    ctx.fillRect(
                        sideX +
                        6 +
                        c * 14,

                        y -
                        b.height +
                        8 +
                        r * 17,

                        5,
                        6
                    );
                }
            }
        }
    }
}

/* =========================================================
   ROAD
   ========================================================= */

function drawRoad() {

    const horizon =
        H * .39;

    const bottom =
        H * .92;

    const center =
        W / 2;

    const topWidth =
        60;

    const bottomWidth =
        Math.min(
            W * .82,
            780
        );

    /* Road */

    ctx.beginPath();

    ctx.moveTo(
        center - topWidth,
        horizon
    );

    ctx.lineTo(
        center + topWidth,
        horizon
    );

    ctx.lineTo(
        center + bottomWidth,
        bottom
    );

    ctx.lineTo(
        center - bottomWidth,
        bottom
    );

    ctx.closePath();

    const roadGradient =
        ctx.createLinearGradient(
            0,
            horizon,
            0,
            bottom
        );

    roadGradient.addColorStop(
        0,
        "#151a34"
    );

    roadGradient.addColorStop(
        1,
        "#080b19"
    );

    ctx.fillStyle =
        roadGradient;

    ctx.fill();

    /* Road borders */

    ctx.strokeStyle =
        "rgba(0,234,255,.5)";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(
        center - topWidth,
        horizon
    );

    ctx.lineTo(
        center - bottomWidth,
        bottom
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        center + topWidth,
        horizon
    );

    ctx.lineTo(
        center + bottomWidth,
        bottom
    );

    ctx.stroke();

    /* Lane lines */

    for (let lane = 0; lane < 2; lane++) {

        const topX =
            center -
            topWidth +
            (topWidth * 2 / 3) +
            lane *
            (topWidth * 2 / 3);

        const bottomX =
            center -
            bottomWidth +
            (bottomWidth * 2 / 3) +
            lane *
            (bottomWidth * 2 / 3);

        ctx.setLineDash([
            18,
            22
        ]);

        ctx.lineDashOffset =
            -performance.now() / 8;

        ctx.strokeStyle =
            "rgba(255,255,255,.15)";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.moveTo(
            topX,
            horizon
        );

        ctx.lineTo(
            bottomX,
            bottom
        );

        ctx.stroke();

        ctx.setLineDash([]);
    }

    /* Perspective lights */

    for (let i = 0; i < 10; i++) {

        const depth =
            (i / 10 +
            (performance.now() / 8000))
            % 1;

        const y =
            depthY(depth);

        const left =
            laneX(0, depth);

        const right =
            laneX(2, depth);

        ctx.globalAlpha =
            .25 *
            depth;

        ctx.fillStyle =
            "#00eaff";

        ctx.fillRect(
            left - 3,
            y,
            6,
            2
        );

        ctx.fillRect(
            right - 3,
            y,
            6,
            2
        );

        ctx.globalAlpha = 1;
    }
}

/* =========================================================
   STREET LIGHTS
   ========================================================= */

function drawLights() {

    for (let i = 0; i < 9; i++) {

        const depth =
            (i / 9 +
            performance.now() / 12000)
            % 1;

        const y =
            depthY(depth);

        const scale =
            .15 +
            depth * .8;

        const leftX =
            laneX(0, depth) -
            55 * scale;

        const rightX =
            laneX(2, depth) +
            55 * scale;

        drawLamp(
            leftX,
            y,
            scale
        );

        drawLamp(
            rightX,
            y,
            scale
        );
    }
}

function drawLamp(x, y, scale) {

    const poleHeight =
        100 * scale;

    ctx.strokeStyle =
        "rgba(150,180,220,.35)";

    ctx.lineWidth =
        3 * scale;

    ctx.beginPath();

    ctx.moveTo(
        x,
        y
    );

    ctx.lineTo(
        x,
        y - poleHeight
    );

    ctx.stroke();

    ctx.fillStyle =
        "#00eaff";

    ctx.shadowColor =
        "#00eaff";

    ctx.shadowBlur =
        18 * scale;

    ctx.beginPath();

    ctx.arc(
        x,
        y - poleHeight,
        5 * scale,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.shadowBlur = 0;
}

function spawnObstacle() {

        );

    ];

            )
        ];

        )

            Math.random() * 3
        );

        3 +
        Math.floor(
            Math.random() * 4
        );

    for (let i = 0; i < count; i++) {

            )
        );

/* =========================================================
   COLLISION
   ========================================================= */

function checkObstacleCollision() {

    for (const obstacle of obstacles) {

        if (
            obstacle.depth < .86 ||
            obstacle.depth > 1.03
        ) {
            continue;
        }

        if (
            obstacle.lane !==
            player.targetLane
        ) {
            continue;
        }

        /* Jump clears obstacles */

        if (player.jumpY > 38) {
            continue;
        }

        gameOver();

        return;
    }
}

/* =========================================================
   GAME START
   ========================================================= */

function startGame() {

    gameState = STATE.PLAYING;

    score = 0;
    coins = 0;
    distance = 0;

    gameSpeed = .42;
    difficulty = 0;

    spawnTimer = .5;
    coinTimer = 1;

    obstacles = [];
    coinObjects = [];
    particles = [];

    player.reset();

    homeScreen.classList.add("hidden");

    pauseOverlay.classList.remove("active");
    gameOverOverlay.classList.remove("active");

    hud.classList.add("visible");

    updateHUD();

    if (!animationFrame) {

        lastTime =
            performance.now();

        animationFrame =
            requestAnimationFrame(
                gameLoop
            );
    }
}

/* =========================================================
   GAME OVER
   ========================================================= */

function gameOver() {

    if (
        gameState !==
        STATE.PLAYING
    ) {
        return;
    }

    gameState =
        STATE.GAMEOVER;

    shake = 18;

    createCrashParticles(
        player.x,
        player.y -
        player.jumpY
    );

    playCrashSound();

    const finalScoreValue =
        Math.floor(score);

    if (
        finalScoreValue >
        bestScore
    ) {
        bestScore =
            finalScoreValue;

        storage.set(
            "metroRushBest",
            bestScore
        );
    }

    if (
        coins >
        bestCoins
    ) {
        bestCoins =
            coins;

        storage.set(
            "metroRushCoins",
            bestCoins
        );
    }

    finalScore.textContent =
        finalScoreValue.toLocaleString();

    finalCoins.textContent =
        coins.toLocaleString();

    finalDistance.textContent =
        Math.floor(distance) + "m";

    finalBest.textContent =
        bestScore.toLocaleString();

    homeBest.textContent =
        bestScore.toLocaleString();

    homeCoins.textContent =
        bestCoins.toLocaleString();

    setTimeout(() => {

        gameOverOverlay.classList.add(
            "active"
        );

    }, 350);
}

/* =========================================================
   PAUSE
   ========================================================= */

function pauseGame() {

    if (
        gameState !==
        STATE.PLAYING
    ) {
        return;
    }

    gameState =
        STATE.PAUSED;

    pauseOverlay.classList.add(
        "active"
    );
}

function resumeGame() {

    if (
        gameState !==
        STATE.PAUSED
    ) {
        return;
    }

    gameState =
        STATE.PLAYING;

    pauseOverlay.classList.remove(
        "active"
    );

    lastTime =
        performance.now();
}

/* =========================================================
   HOME
   ========================================================= */

function goHome() {

    gameState =
        STATE.HOME;

    pauseOverlay.classList.remove(
        "active"
    );

    gameOverOverlay.classList.remove(
        "active"
    );

    hud.classList.remove(
        "visible"
    );

    homeScreen.classList.remove(
        "hidden"
    );

    obstacles = [];
    coinObjects = [];
    particles = [];

    homeBest.textContent =
        bestScore.toLocaleString();

    homeCoins.textContent =
        bestCoins.toLocaleString();
}

/* =========================================================
   HUD
   ========================================================= */

function updateHUD() {

    scoreDisplay.textContent =
        Math.floor(score).toLocaleString();

    coinDisplay.textContent =
        coins.toLocaleString();

    distanceDisplay.textContent =
        Math.floor(distance) +
        "m";

        Math.min(

            15 +

        );

    speedBar.style.width =

/* =========================================================
   UPDATE
   ========================================================= */

function update(dt) {

    player.update(dt);

    difficulty +=
        dt * .12;

    gameSpeed =
        Math.min(
            .92,
            .42 +
            difficulty * .018
        );

    distance +=
        gameSpeed *
        dt *
        34;

    score +=
        gameSpeed *
        dt *
        20;

    /* Obstacles */

    spawnTimer -= dt;

    if (spawnTimer <= 0) {

        spawnObstacle();

        spawnTimer =
            Math.max(
                .48,
                1.25 -
                difficulty * .025
            );
    }

    /* Coins */

    coinTimer -= dt;

    if (coinTimer <= 0) {

        spawnCoinLine();

        coinTimer =
            Math.max(
                .65,
                1.45 -
                difficulty * .015
            );
    }

    /* Update obstacles */

    for (const obstacle of obstacles) {

        obstacle.update(dt);
    }

    obstacles =
        obstacles.filter(
            o => !o.dead
        );

    /* Update coins */

    for (const coin of coinObjects) {

        coin.update(dt);
    }

    coinObjects =
        coinObjects.filter(
            c => !c.dead
        );

    checkObstacleCollision();

    updateParticles(dt);

    if (shake > 0) {

        shake *=
            Math.pow(
                .04,
                dt
            );

        if (shake < .2) {
            shake = 0;
        }
    }

    updateHUD();
}

/* =========================================================
   DRAW
   ========================================================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    ctx.save();

    if (shake > 0) {

        ctx.translate(
            (Math.random() - .5) *
            shake,

            (Math.random() - .5) *
            shake
        );
    }

    drawSky();
    drawCity();
    drawRoad();
    drawLights();

    /* Sort objects by depth */

    const renderObjects = [
        ...coinObjects.map(
            object => ({
                object,
                depth: object.depth,
                type: "coin"
            })
        ),

        ...obstacles.map(
            object => ({
                object,
                depth: object.depth,
                type: "obstacle"
            })
        )
    ];

    renderObjects.sort(
        (a, b) =>
            a.depth -
            b.depth
    );

    for (
        const item of renderObjects
    ) {

        item.object.draw();
    }

    player.draw();

    drawParticles();

    /* Speed streaks */

    if (
        gameState === STATE.PLAYING &&
        gameSpeed > .6
    ) {

        ctx.globalAlpha =
            (gameSpeed - .6) *
            .45;

        ctx.strokeStyle =
            "#9fefff";

        ctx.lineWidth = 1;

        for (let i = 0; i < 15; i++) {

            const x =
                Math.random() * W;

            const y =
                Math.random() * H;

            ctx.beginPath();

            ctx.moveTo(
                x,
                y
            );

            ctx.lineTo(
                x,
                y + 20 +
                gameSpeed * 30
            );

            ctx.stroke();
        }

        ctx.globalAlpha = 1;
    }

    ctx.restore();
}

/* =========================================================
   MAIN LOOP
   ========================================================= */

function gameLoop(time) {

    animationFrame =
        requestAnimationFrame(
            gameLoop
        );

    const rawDelta =
        (time - lastTime) /
        1000;

    const dt =
        Math.min(
            rawDelta,
            .035
        );

    lastTime = time;

    if (
        gameState ===
        STATE.PLAYING
    ) {

        update(dt);
    }

    draw();
}

/* =========================================================
   INPUT
   ========================================================= */

window.addEventListener(
    "keydown",
    event => {

        if (
            event.code ===
            "ArrowLeft"
        ) {

            event.preventDefault();
            player.moveLeft();

        } else if (
            event.code ===
            "ArrowRight"
        ) {

            event.preventDefault();
            player.moveRight();

        } else if (
            event.code ===
            "ArrowUp" ||
            event.code ===
            "Space"
        ) {

            event.preventDefault();
            player.jump();

        } else if (
            event.code ===
            "Escape"
        ) {

            event.preventDefault();

            if (
                gameState ===
                STATE.PLAYING
            ) {

                pauseGame();

            } else if (
                gameState ===
                STATE.PAUSED
            ) {

                resumeGame();
            }
        }
    }
);

/* =========================================================
   TOUCH / SWIPE
   ========================================================= */

let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener(
    "touchstart",
    event => {

        const touch =
            event.changedTouches[0];

        touchStartX =
            touch.clientX;

        touchStartY =
            touch.clientY;

    },
    {
        passive: true
    }
);

canvas.addEventListener(
    "touchend",
    event => {

        if (
            gameState !==
            STATE.PLAYING
        ) {
            return;
        }

        const touch =
            event.changedTouches[0];

        const dx =
            touch.clientX -
            touchStartX;

        const dy =
            touch.clientY -
            touchStartY;

        const threshold = 35;

        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {

            if (
                Math.abs(dx) >
                threshold
            ) {

                if (dx > 0) {
                    player.moveRight();
                } else {
                    player.moveLeft();
                }
            }

        } else {

            if (
                dy <
                -threshold
            ) {

                player.jump();
            }
        }
    },
    {
        passive: true
    }
);

/* =========================================================
   BUTTONS
   ========================================================= */

playButton.addEventListener(
    "click",
    () => {

        startAudio();

        startGame();
    }
);

pauseButton.addEventListener(
    "click",
    pauseGame
);

resumeButton.addEventListener(
    "click",
    resumeGame
);

pauseRestartButton.addEventListener(
    "click",
    () => {

        pauseOverlay.classList.remove(
            "active"
        );

        startGame();
    }
);

restartButton.addEventListener(
    "click",
    startGame
);

homeButton.addEventListener(
    "click",
    goHome
);

/* =========================================================
   AUDIO ENGINE
   ========================================================= */

let audioContext = null;

function startAudio() {

    if (!audioContext) {

        try {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        } catch {
            return;
        }
    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();
    }
}

function playTone(
    frequency,
    duration
) {

    if (!audioContext) return;

    try {

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type =
            "sine";

        oscillator.frequency.value =
            frequency;

        gain.gain.setValueAtTime(
            .0001,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .07,
            audioContext.currentTime + .008
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            audioContext.currentTime +
            duration
        );

        oscillator.connect(gain);
        gain.connect(
            audioContext.destination
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            duration
        );

    } catch {}
}

function playCrashSound() {

    if (!audioContext) return;

    try {

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type =
            "sawtooth";

        oscillator.frequency.setValueAtTime(
            180,
            audioContext.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            45,
            audioContext.currentTime + .45
        );

        gain.gain.setValueAtTime(
            .15,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime + .45
        );

        oscillator.connect(gain);
        gain.connect(
            audioContext.destination
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + .45
        );

    } catch {}
}

/* =========================================================
   HELPERS
   ========================================================= */

function roundRect(
    x,
    y,
    width,
    height,
    radius
) {

    radius =
        Math.min(
            radius,
            width / 2,
            height / 2
        );

    ctx.beginPath();

    ctx.moveTo(
        x + radius,
        y
    );

    ctx.arcTo(
        x + width,
        y,
        x + width,
        y + height,
        radius
    );

    ctx.arcTo(
        x + width,
        y + height,
        x,
        y + height,
        radius
    );

    ctx.arcTo(
        x,
        y + height,
        x,
        y,
        radius
    );

    ctx.arcTo(
        x,
        y,
        x + width,
        y,
        radius
    );

    ctx.closePath();
}

function laneXSimple(lane) {

    return laneX(
        lane,
        1
    );
}

/* =========================================================
   INITIALIZE
   ========================================================= */

player.reset();

generateBuildings();

draw();

animationFrame =
    requestAnimationFrame(
        gameLoop
    );

/* =========================================================
   PREVENT CONTEXT MENU / SCROLL
   ========================================================= */

document.addEventListener(
    "contextmenu",
    event => event.preventDefault()
);

document.addEventListener(
    "touchmove",
    event => {

        if (
            gameState !==
            STATE.HOME
        ) {

            event.preventDefault();
        }

    },
    {
        passive: false
    }
);

</script>
